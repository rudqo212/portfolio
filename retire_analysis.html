<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>퇴직연금 분석 · Z계좌</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&family=Fira+Code:wght@400;600&display=swap');

:root {
  --bg: #080c12;
  --bg2: #0e1420;
  --bg3: #141c2a;
  --border: #1e2d42;
  --border2: #243347;
  --text: #d4dde8;
  --text2: #7a95ae;
  --text3: #4a6278;
  --gold: #f0a832;
  --gold2: #c47e10;
  --green: #34d47a;
  --red: #f05252;
  --blue: #4a90d9;
  --purple: #9b72e8;
  --orange: #f07832;
  --teal: #34c4b4;
  --safe: #4a90d9;
  --domestic: #34d47a;
  --overseas: #9b72e8;
  --theme: #f07832;
}

* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  background: var(--bg);
  color: var(--text);
  font-family: 'Noto Sans KR', sans-serif;
  font-size: 14px;
  min-height: 100vh;
  padding: 0 0 60px;
}

/* ── 헤더 ── */
.header {
  background: linear-gradient(135deg, #0e1a2e 0%, #0a1220 100%);
  border-bottom: 1px solid var(--border);
  padding: 14px 16px 10px;
  position: sticky; top: 0; z-index: 100;
  backdrop-filter: blur(12px);
}
.header-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 4px; }
.header-title { font-size: 15px; font-weight: 700; color: var(--gold); letter-spacing: -0.3px; }
.header-sub { font-size: 11px; color: var(--text3); font-family: 'Fira Code', monospace; }
.refresh-btn {
  background: #00ff8815; border: 1px solid #00ff8840;
  border-radius: 8px; color: #00ff88;
  padding: 8px 14px; font-size: 13px; cursor: pointer;
  font-family: 'Noto Sans KR', sans-serif; white-space: nowrap;
}
.refresh-btn:hover { background: #00ff8825; }

/* ── 요약 카드 행 ── */
.summary-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; padding: 14px 16px 0; }
.sum-card {
  background: var(--bg2); border: 1px solid var(--border);
  border-radius: 10px; padding: 10px 10px;
  overflow: hidden; min-width: 0;
}
.sum-label { font-size: 10px; color: var(--text3); margin-bottom: 4px; letter-spacing: 0.3px; white-space: nowrap; }
.sum-val { font-size: 14px; font-weight: 700; font-family: 'Fira Code', monospace; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.sum-sub { font-size: 10px; color: var(--text3); margin-top: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pos { color: var(--green); }
.neg { color: var(--red); }
.neu { color: var(--text); }

/* ── 섹션 ── */
.section { padding: 16px 16px 0; }
.sec-title {
  font-size: 12px; color: var(--text3); letter-spacing: 1px;
  text-transform: uppercase; margin-bottom: 10px;
  display: flex; align-items: center; gap: 6px;
}
.sec-title::after { content:''; flex:1; height:1px; background: var(--border); }

/* ── 도넛 + 범례 ── */
.donut-area { display: flex; align-items: center; gap: 20px; }
.donut-wrap { position: relative; flex-shrink: 0; }
.donut-center {
  position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%);
  text-align: center;
}
.donut-center-val { font-size: 16px; font-weight: 700; font-family: 'Fira Code', monospace; color: var(--text); }
.donut-center-label { font-size: 11px; color: var(--text3); margin-top: 1px; }
.legend-list { flex: 1; display: flex; flex-direction: column; gap: 10px; }
.leg { display: flex; align-items: center; gap: 8px; }
.leg-dot { width: 11px; height: 11px; border-radius: 50%; flex-shrink: 0; }
.leg-name { flex: 1; color: var(--text2); font-size: 13px; }
.leg-pct { font-family: 'Fira Code', monospace; font-size: 13px; font-weight: 600; }
.leg-amt { font-size: 11px; color: var(--text3); margin-left: 4px; }

/* ── 바 차트 ── */
.bar-item { margin-bottom: 10px; }
.bar-top { display: flex; justify-content: space-between; font-size: 12px; margin-bottom: 4px; }
.bar-name { color: var(--text2); }
.bar-right { color: var(--text3); font-family: 'Fira Code', monospace; }
.bar-track { background: var(--bg3); border-radius: 3px; height: 7px; overflow: hidden; }
.bar-fill { height: 100%; border-radius: 3px; transition: width 0.8s cubic-bezier(.4,0,.2,1); }

/* ── 추천 비교 ── */
.compare-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.cmp-card { background: var(--bg2); border: 1px solid var(--border); border-radius: 10px; padding: 12px; }
.cmp-title { font-size: 11px; color: var(--text3); margin-bottom: 8px; letter-spacing: 0.5px; }
.cmp-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 7px; font-size: 13px; }
.cmp-cat { color: var(--text2); display: flex; align-items: center; gap: 5px; }
.cmp-dot { width: 8px; height: 8px; border-radius: 50%; }
.cmp-val { font-family: 'Fira Code', monospace; font-weight: 600; }
.over  { color: var(--red); }
.under { color: var(--gold); }
.ok    { color: var(--green); }

/* ── 갭 화살표 ── */
.gap-list { display: flex; flex-direction: column; gap: 7px; }
.gap-row {
  background: var(--bg2); border: 1px solid var(--border);
  border-radius: 8px; padding: 10px 13px;
  display: flex; align-items: center; gap: 8px;
}
.gap-cat { display: flex; align-items: center; gap: 6px; flex: 1; font-size: 13px; color: var(--text2); }
.gap-now { font-family: 'Fira Code', monospace; font-size: 13px; font-weight: 600; }
.gap-arrow { font-size: 12px; color: var(--text3); }
.gap-target { font-family: 'Fira Code', monospace; font-size: 12px; color: var(--text3); }
.gap-diff { font-size: 11px; font-family: 'Fira Code', monospace; }

/* ── 안전진단 스코어 ── */
.score-box {
  background: var(--bg2); border: 1px solid var(--border);
  border-radius: 12px; padding: 16px;
}
.score-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
.score-label { font-size: 13px; color: var(--text2); }
.score-num { font-size: 30px; font-weight: 700; font-family: 'Fira Code', monospace; }
.score-grade { font-size: 13px; margin-left: 6px; }
.score-bar-track { background: var(--bg3); border-radius: 4px; height: 8px; margin-bottom: 12px; overflow: hidden; }
.score-bar-fill { height: 100%; border-radius: 4px; transition: width 1s ease; }
.score-items { display: flex; flex-direction: column; gap: 7px; }
.score-item { display: flex; justify-content: space-between; font-size: 12px; }
.score-item-label { color: var(--text3); }
.score-item-val { font-family: 'Fira Code', monospace; font-weight: 600; }
.check { color: var(--green); }
.warn  { color: var(--gold); }
.fail  { color: var(--red); }

/* ── 종목 테이블 ── */
.stock-table { width: 100%; border-collapse: collapse; table-layout: fixed; }
.stock-table th {
  font-size: 10px; color: var(--text3); text-align: left;
  padding: 7px 6px; border-bottom: 1px solid var(--border);
  letter-spacing: 0.3px; font-weight: 400;
}
.stock-table td {
  padding: 8px 6px; border-bottom: 1px solid var(--border);
  font-size: 11px; vertical-align: middle; overflow: hidden;
}
.stock-table tr:last-child td { border-bottom: none; }
.td-name { color: var(--text); font-weight: 500; word-break: keep-all; line-height: 1.4; width: 36%; }
.td-num { font-family: 'Fira Code', monospace; text-align: right; font-size: 11px; white-space: nowrap; }
.td-pct { font-family: 'Fira Code', monospace; text-align: right; font-weight: 700; font-size: 11px; white-space: nowrap; }

/* ── 조언 카드 ── */
.advice-list { display: flex; flex-direction: column; gap: 8px; }
.advice-card {
  border-radius: 8px; padding: 11px 13px;
  display: flex; gap: 10px; align-items: flex-start;
  font-size: 13px; line-height: 1.65;
}
.advice-icon { font-size: 15px; flex-shrink: 0; margin-top: 1px; }
.advice-text { color: var(--text2); }
.advice-text strong { color: var(--text); }
.card-red    { background: #f0525210; border: 1px solid #f0525230; }
.card-gold   { background: #f0a83210; border: 1px solid #f0a83230; }
.card-green  { background: #34d47a10; border: 1px solid #34d47a30; }
.card-blue   { background: #4a90d910; border: 1px solid #4a90d930; }

.no-data { text-align: center; padding: 40px 20px; color: var(--text3); font-size: 14px; }
</style>
</head>
<body>

<div class="header">
  <div class="header-top">
    <div class="header-title">🏦 퇴직연금 Z계좌 · 포트폴리오 분석</div>
    <button class="refresh-btn" onclick="init()">↻ 시세갱신</button>
  </div>
  <div class="header-sub" id="headerSub">데이터 로딩 중...</div>
</div>

<div id="mainContent"></div>

<script>
// ── 섹터 분류 테이블 ──
const SECTOR = {
  "379810": { name: "KODEX 미국나스닥100",           cat: "해외지수", color: "var(--overseas)" },
  "102780": { name: "KODEX 삼성그룹",               cat: "테마",    color: "var(--theme)" },
  "0177N0": { name: "KODEX 삼성전자SK하이닉스채권혼합50", cat: "안전자산", color: "var(--safe)" },
  "487240": { name: "KODEX AI전력핵심설비",           cat: "테마",    color: "var(--theme)" },
  "102110": { name: "TIGER 200",                   cat: "국내지수", color: "var(--domestic)" },
  "360750": { name: "TIGER 미국S&P500",             cat: "해외지수", color: "var(--overseas)" },
  "396500": { name: "TIGER 반도체TOP10",             cat: "테마",    color: "var(--theme)" },
  "475630": { name: "TIGER CD1년금리액티브(합성)",     cat: "안전자산", color: "var(--safe)" },
  "445290": { name: "KODEX 로봇액티브",              cat: "테마",    color: "var(--theme)" },
  "069500": { name: "KODEX 200",                   cat: "국내지수", color: "var(--domestic)" },
  "367380": { name: "KODEX 미국나스닥100(구)",        cat: "해외지수", color: "var(--overseas)" },
};
const CAT_COLORS = {
  "안전자산": "var(--safe)",
  "국내지수": "var(--domestic)",
  "해외지수": "var(--overseas)",
  "테마":    "var(--theme)",
};
const CAT_ORDER = ["안전자산", "국내지수", "해외지수", "테마"];
const TARGET = { "안전자산": 30, "국내지수": 25, "해외지수": 25, "테마": 20 };

// ── 거래 내역 → 평균단가/잔량 계산 ──
function calcAvg(txs) {
  let qty = 0, cost = 0;
  (txs || []).forEach(t => {
    if (t.type === "buy")  { cost += t.price * t.qty; qty += t.qty; }
    if (t.type === "sell") { cost -= (cost / qty) * t.qty; qty -= t.qty; }
  });
  return { qty, avg: qty > 0 ? cost / qty : 0 };
}
function realizedPnl(txs) {
  let qty = 0, cost = 0, realized = 0;
  (txs || []).forEach(t => {
    if (t.type === "buy")  { cost += t.price * t.qty; qty += t.qty; }
    if (t.type === "sell") {
      const avgCost = qty > 0 ? cost / qty : 0;
      realized += (t.price - avgCost) * t.qty;
      cost -= avgCost * t.qty; qty -= t.qty;
    }
  });
  return realized;
}

function fmt(n) { return Math.abs(n) >= 10000 ? (n/10000).toFixed(1)+"만" : n.toLocaleString(); }
function fmtW(n) { return "₩" + Math.round(n).toLocaleString(); }
function fmtPct(n) { return (n >= 0 ? "+" : "") + n.toFixed(2) + "%"; }

// ── 메인 초기화 ──
function init() {
  const stocks   = JSON.parse(localStorage.getItem("pf_stocks_v2")   || "[]");
  const prices   = JSON.parse(localStorage.getItem("pf_prices_v2")   || "{}");
  const funds    = JSON.parse(localStorage.getItem("pf_retire_funds") || "[]");
  const usdKrw   = parseFloat(localStorage.getItem("pf_usdkrw") || "1500");
  const now      = new Date();

  const zStocks = stocks.filter(s => (s.broker || "") === "Z");

  document.getElementById("headerSub").textContent =
    `${now.toLocaleDateString("ko-KR")} ${now.toLocaleTimeString("ko-KR", {hour:"2-digit",minute:"2-digit"})} 기준 · 종목 ${zStocks.length}개`;

  if (zStocks.length === 0) {
    document.getElementById("mainContent").innerHTML =
      `<div class="no-data">📭 Z계좌 종목이 없습니다.<br>포트폴리오 트래커에서 종목을 추가해 주세요.</div>`;
    return;
  }

  // ── 종목별 평가 계산 ──
  let rows = [];
  let totalCost = 0, totalVal = 0, totalRealized = 0;

  zStocks.forEach(s => {
    const { qty, avg } = calcAvg(s.transactions);
    if (qty <= 0) return;
    const fx  = s.market === "NASDAQ" ? usdKrw : 1;
    const cur = (prices[s.code] || 0);
    const cost = avg * qty * fx;
    const val  = cur * qty * fx;
    const pnl  = val - cost;
    const pct  = cost > 0 ? (pnl / cost * 100) : 0;
    const real = realizedPnl(s.transactions) * fx;
    const sec  = SECTOR[s.code] || { name: s.name, cat: "기타", color: "#888" };
    totalCost += cost; totalVal += val; totalRealized += real;
    rows.push({ code: s.code, name: s.name, cat: sec.cat, color: sec.color, qty, avg, cur, cost, val, pnl, pct, real });
  });

  // 펀드
  funds.forEach(f => {
    if (f.amt <= 0) return;
    totalCost += f.amt; totalVal += f.amt;
    rows.push({ code: "FUND", name: f.name, cat: f.risk === "safe" ? "안전자산" : "테마",
      color: f.risk === "safe" ? "var(--safe)" : "var(--theme)",
      qty: 1, avg: f.amt, cur: f.amt, cost: f.amt, val: f.amt, pnl: 0, pct: 0, real: 0 });
  });

  rows.sort((a, b) => b.val - a.val);

  const totalPnl = totalVal - totalCost;
  const totalPct = totalCost > 0 ? (totalPnl / totalCost * 100) : 0;

  // ── 카테고리별 집계 ──
  const catMap = {};
  rows.forEach(r => {
    catMap[r.cat] = (catMap[r.cat] || 0) + r.val;
  });
  const catTotal = Object.values(catMap).reduce((a, b) => a + b, 0);

  // ── 안전진단 점수 ──
  const safeRatio   = (catMap["안전자산"] || 0) / catTotal * 100;
  const indexRatio  = ((catMap["국내지수"] || 0) + (catMap["해외지수"] || 0)) / catTotal * 100;
  const themeRatio  = (catMap["테마"] || 0) / catTotal * 100;
  const dupOverseas = rows.filter(r => r.cat === "해외지수").length >= 2;

  let score = 100;
  let scoreItems = [];

  // 안전자산 30% 이상
  if (safeRatio >= 30) {
    scoreItems.push({ icon: "✅", label: "안전자산 30% 이상", val: safeRatio.toFixed(1) + "%", cls: "check" });
  } else {
    score -= 20;
    scoreItems.push({ icon: "⚠️", label: "안전자산 부족 (30% 권장)", val: safeRatio.toFixed(1) + "%", cls: "warn" });
  }

  // 지수형 40% 이상
  if (indexRatio >= 40) {
    scoreItems.push({ icon: "✅", label: "지수형 ETF 40% 이상", val: indexRatio.toFixed(1) + "%", cls: "check" });
  } else {
    score -= 15;
    scoreItems.push({ icon: "⚠️", label: "지수형 ETF 부족 (40% 권장)", val: indexRatio.toFixed(1) + "%", cls: "warn" });
  }

  // 테마 30% 이하
  if (themeRatio <= 30) {
    scoreItems.push({ icon: "✅", label: "테마 ETF 30% 이하", val: themeRatio.toFixed(1) + "%", cls: "check" });
  } else {
    score -= 15;
    scoreItems.push({ icon: "❌", label: "테마 ETF 과다 (30% 초과)", val: themeRatio.toFixed(1) + "%", cls: "fail" });
  }

  // 해외지수 중복
  if (!dupOverseas) {
    scoreItems.push({ icon: "✅", label: "해외지수 ETF 중복 없음", val: "OK", cls: "check" });
  } else {
    score -= 10;
    scoreItems.push({ icon: "⚠️", label: "해외지수 ETF 중복 보유", val: "나스닥+S&P500", cls: "warn" });
  }

  // 수익률
  if (totalPct >= -5) {
    scoreItems.push({ icon: "✅", label: "전체 수익률 -5% 이내", val: fmtPct(totalPct), cls: "check" });
  } else {
    score -= 10;
    scoreItems.push({ icon: "⚠️", label: "전체 수익률 주의", val: fmtPct(totalPct), cls: "warn" });
  }

  const scoreGrade = score >= 85 ? { label: "우수", color: "var(--green)" }
                   : score >= 70 ? { label: "양호", color: "var(--gold)" }
                   : score >= 55 ? { label: "보통", color: "var(--orange)" }
                   : { label: "주의", color: "var(--red)" };

  // ── 조언 생성 ──
  let advices = [];

  if (safeRatio < 25) {
    advices.push({ type: "red", icon: "🔴", text: "<strong>안전자산이 너무 적습니다.</strong> 퇴직연금은 원금 보존이 우선이에요. TIGER CD금리나 채권혼합50 비중을 30% 이상으로 늘리는 걸 권장합니다." });
  } else if (safeRatio > 55) {
    advices.push({ type: "gold", icon: "🟡", text: "<strong>안전자산 비중이 권장치보다 높습니다.</strong> CD금리 ETF 매도로 확보한 자금을 지수형 ETF(TIGER200, 나스닥100)로 분산하면 장기 수익률을 높일 수 있어요." });
  } else {
    advices.push({ type: "green", icon: "🟢", text: "<strong>안전자산 비중이 적정합니다.</strong> 현재 구조를 유지하세요." });
  }

  if (dupOverseas) {
    advices.push({ type: "gold", icon: "🟡", text: "<strong>나스닥100과 S&P500을 동시에 보유 중입니다.</strong> 두 지수는 90% 이상 겹칩니다. 하나로 통일하면 집중도를 높이고 관리도 쉬워져요. 성장성은 나스닥100, 안정성은 S&P500이 우선입니다." });
  }

  const worstStock = rows.filter(r => r.pct < -10);
  if (worstStock.length > 0) {
    const ws = worstStock[0];
    advices.push({ type: "red", icon: "🔴", text: `<strong>${ws.name}</strong>이(가) ${fmtPct(ws.pct)} 손실 중입니다. 테마의 장기 유효성이 살아있으면 홀드, 논리가 무너졌으면 손절을 고려하세요.` });
  }

  if (themeRatio > 25) {
    advices.push({ type: "gold", icon: "🟡", text: `<strong>테마 ETF 비중이 ${themeRatio.toFixed(1)}%로 높습니다.</strong> 퇴직연금 특성상 20% 이내 유지를 권장합니다. 단기 급등한 테마는 일부 차익실현 후 지수형으로 이동하는 전략을 고려하세요.` });
  }

  advices.push({ type: "blue", icon: "💡", text: "<strong>퇴직연금은 지루할수록 잘 굴리는 겁니다.</strong> 월 1~2회 정도 꾸준한 적립식이 장기적으로 가장 효과적이에요. 잦은 매수보다 구조를 잡고 기다리는 게 맞습니다." });

  // ── 도넛 SVG 생성 ──
  function buildDonut(w, h, r, strokeW) {
    const cx = w / 2, cy = h / 2;
    const circ = 2 * Math.PI * r;
    let offset = 0;
    let paths = `<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="#1a2535" stroke-width="${strokeW}"/>`;
    CAT_ORDER.forEach(cat => {
      if (!catMap[cat]) return;
      const pct = catMap[cat] / catTotal;
      const dash = pct * circ;
      const gap  = circ - dash;
      paths += `<circle cx="${cx}" cy="${cy}" r="${r}" fill="none"
        stroke="${CAT_COLORS[cat]}" stroke-width="${strokeW}"
        stroke-dasharray="${dash.toFixed(2)} ${gap.toFixed(2)}"
        stroke-dashoffset="${(circ * 0.25 - offset).toFixed(2)}"
        style="transition:stroke-dasharray 0.8s ease"/>`;
      offset += dash;
    });
    return `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}">${paths}</svg>`;
  }

  // ── HTML 렌더링 ──
  document.getElementById("mainContent").innerHTML = `

  <!-- 요약 카드 -->
  <div class="summary-row">
    <div class="sum-card">
      <div class="sum-label">총 평가금액</div>
      <div class="sum-val neu" style="font-size:12px">${fmtW(totalVal)}</div>
      <div class="sum-sub">매입 ${fmtW(totalCost)}</div>
    </div>
    <div class="sum-card">
      <div class="sum-label">미실현 손익</div>
      <div class="sum-val ${totalPnl >= 0 ? "pos" : "neg"}" style="font-size:12px">${totalPnl >= 0 ? "+" : ""}${fmtW(totalPnl)}</div>
      <div class="sum-sub ${totalPct >= 0 ? "pos" : "neg"}">${fmtPct(totalPct)}</div>
    </div>
    <div class="sum-card">
      <div class="sum-label">안전진단</div>
      <div class="sum-val" style="color:${scoreGrade.color};font-size:16px">${score}<span style="font-size:10px"> /100</span></div>
      <div class="sum-sub" style="color:${scoreGrade.color}">${scoreGrade.label}</div>
    </div>
  </div>

  <!-- 구분별 비중 도넛 -->
  <div class="section" style="margin-top:16px">
    <div class="sec-title">구분별 비중</div>
    <div class="donut-area">
      <div class="donut-wrap">
        ${buildDonut(130, 130, 48, 20)}
        <div class="donut-center">
          <div class="donut-center-val">${rows.length}</div>
          <div class="donut-center-label">종목</div>
        </div>
      </div>
      <div class="legend-list">
        ${CAT_ORDER.map(cat => {
          const val = catMap[cat] || 0;
          const pct = catTotal > 0 ? val / catTotal * 100 : 0;
          if (!val) return "";
          return `<div class="leg">
            <div class="leg-dot" style="background:${CAT_COLORS[cat]}"></div>
            <span class="leg-name">${cat}</span>
            <span class="leg-pct" style="color:${CAT_COLORS[cat]}">${pct.toFixed(1)}%</span>
          </div>`;
        }).join("")}
      </div>
    </div>
  </div>

  <!-- 종목별 바 차트 -->
  <div class="section" style="margin-top:16px">
    <div class="sec-title">종목별 비중</div>
    ${rows.map(r => {
      const pct = catTotal > 0 ? r.val / catTotal * 100 : 0;
      return `<div class="bar-item">
        <div class="bar-top">
          <span class="bar-name">${r.name}</span>
          <span class="bar-right">${pct.toFixed(1)}% · ${fmtW(r.val)}</span>
        </div>
        <div class="bar-track">
          <div class="bar-fill" style="width:${pct}%;background:${r.color}"></div>
        </div>
      </div>`;
    }).join("")}
  </div>

  <!-- 현재 vs 추천 비교 -->
  <div class="section" style="margin-top:16px">
    <div class="sec-title">현재 vs 추천 비중</div>
    <div class="compare-grid">
      <div class="cmp-card">
        <div class="cmp-title">▪ 현재</div>
        ${CAT_ORDER.map(cat => {
          const pct = catTotal > 0 ? (catMap[cat] || 0) / catTotal * 100 : 0;
          const tgt = TARGET[cat];
          const cls = Math.abs(pct - tgt) <= 5 ? "ok" : pct > tgt ? "over" : "under";
          return `<div class="cmp-row">
            <span class="cmp-cat"><span class="cmp-dot" style="background:${CAT_COLORS[cat]}"></span>${cat}</span>
            <span class="cmp-val ${cls}">${pct.toFixed(1)}%</span>
          </div>`;
        }).join("")}
      </div>
      <div class="cmp-card">
        <div class="cmp-title">▪ 추천</div>
        ${CAT_ORDER.map(cat => `
          <div class="cmp-row">
            <span class="cmp-cat"><span class="cmp-dot" style="background:${CAT_COLORS[cat]}"></span>${cat}</span>
            <span class="cmp-val ok">${TARGET[cat]}%</span>
          </div>`).join("")}
      </div>
    </div>
  </div>

  <!-- 갭 분석 -->
  <div class="section" style="margin-top:16px">
    <div class="sec-title">조정 필요 비중</div>
    <div class="gap-list">
      ${CAT_ORDER.map(cat => {
        const pct = catTotal > 0 ? (catMap[cat] || 0) / catTotal * 100 : 0;
        const tgt = TARGET[cat];
        const diff = pct - tgt;
        if (Math.abs(diff) < 2) return `<div class="gap-row">
          <div class="gap-cat"><span class="cmp-dot" style="background:${CAT_COLORS[cat]};display:inline-block;width:8px;height:8px;border-radius:50%"></span>${cat}</div>
          <span class="gap-now ok">${pct.toFixed(1)}%</span>
          <span class="gap-arrow">→</span>
          <span class="gap-target">${tgt}%</span>
          <span class="gap-diff ok">✅ 적정</span>
        </div>`;
        return `<div class="gap-row">
          <div class="gap-cat"><span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:${CAT_COLORS[cat]}"></span>${cat}</div>
          <span class="gap-now ${diff > 0 ? "over" : "under"}">${pct.toFixed(1)}%</span>
          <span class="gap-arrow">${diff > 0 ? "▼" : "▲"}</span>
          <span class="gap-target">${tgt}%</span>
          <span class="gap-diff ${diff > 0 ? "over" : "under"}">${diff > 0 ? "+" : ""}${diff.toFixed(1)}%p ${diff > 0 ? "초과" : "부족"}</span>
        </div>`;
      }).join("")}
    </div>
  </div>

  <!-- 종목 상세 테이블 (섹터별 그룹) -->
  <div class="section" style="margin-top:16px">
    <div class="sec-title">종목 상세</div>
    <div style="background:var(--bg2);border:1px solid var(--border);border-radius:10px;overflow:hidden">
      <table class="stock-table">
        <thead>
          <tr>
            <th>종목</th>
            <th style="text-align:right">수량</th>
            <th style="text-align:right">평단</th>
            <th style="text-align:right">현재가</th>
            <th style="text-align:right">손익률</th>
          </tr>
        </thead>
        <tbody>
          ${CAT_ORDER.map(cat => {
            const catRows = rows.filter(r => r.cat === cat);
            if (!catRows.length) return "";
            const catColor = CAT_COLORS[cat];
            const catBg    = cat === "안전자산" ? "#4a90d920" :
                             cat === "국내지수" ? "#34d47a20" :
                             cat === "해외지수" ? "#9b72e820" : "#f0783220";
            const firstChar = cat[0];
            const catTotal2  = catRows.reduce((s, r) => s + r.val, 0);
            const catCost2   = catRows.reduce((s, r) => s + r.cost, 0);
            const catPnl2    = catTotal2 - catCost2;
            const catPnlPct2 = catCost2 > 0 ? catPnl2 / catCost2 * 100 : 0;
            const subPct     = catTotal > 0 ? catTotal2 / catTotal * 100 : 0;
            const pnlColor   = catPnl2 >= 0 ? "var(--green)" : "var(--red)";
            const pnlSign    = catPnl2 >= 0 ? "+" : "";
            return `
              <tr>
                <td colspan="5" style="padding:6px 10px 5px;background:${catBg};border-bottom:1px solid ${catColor}30">
                  <div style="display:flex;justify-content:space-between;align-items:center">
                    <div>
                      <span style="color:${catColor};font-size:11px;font-weight:600">${cat}</span>
                      <span style="color:${catColor}80;font-size:10px;margin-left:6px">${subPct.toFixed(1)}% · ${fmtW(catTotal2)}</span>
                    </div>
                    <span style="color:${pnlColor};font-size:11px;font-weight:600;font-family:'Fira Code',monospace">${pnlSign}${catPnlPct2.toFixed(2)}%</span>
                  </div>
                </td>
              </tr>
              ${catRows.map(r => `<tr>
                <td class="td-name" style="padding-left:14px">${r.name}</td>
                <td class="td-num">${r.qty % 1 === 0 ? r.qty : r.qty.toFixed(2)}</td>
                <td class="td-num">${r.avg.toLocaleString(undefined,{maximumFractionDigits:0})}</td>
                <td class="td-num">${r.cur.toLocaleString(undefined,{maximumFractionDigits:0})}</td>
                <td class="td-pct ${r.pct >= 0 ? "pos" : "neg"}">${fmtPct(r.pct)}</td>
              </tr>`).join("")}`;
          }).join("")}
        </tbody>
      </table>
    </div>
  </div>

  <!-- 안전진단 상세 -->
  <div class="section" style="margin-top:16px">
    <div class="sec-title">안전진단 상세</div>
    <div class="score-box">
      <div class="score-header">
        <span class="score-label">포트폴리오 안전 점수</span>
        <div>
          <span class="score-num" style="color:${scoreGrade.color}">${score}</span>
          <span class="score-grade" style="color:${scoreGrade.color}">/ 100 · ${scoreGrade.label}</span>
        </div>
      </div>
      <div class="score-bar-track">
        <div class="score-bar-fill" style="width:${score}%;background:${scoreGrade.color}"></div>
      </div>
      <div class="score-items">
        ${scoreItems.map(i => `
          <div class="score-item">
            <span class="score-item-label">${i.icon} ${i.label}</span>
            <span class="score-item-val ${i.cls}">${i.val}</span>
          </div>`).join("")}
      </div>
    </div>
  </div>

  <!-- 운용 조언 -->
  <div class="section" style="margin-top:16px;padding-bottom:20px">
    <div class="sec-title">운용 조언</div>
    <div class="advice-list">
      ${advices.map(a => `
        <div class="advice-card card-${a.type}">
          <span class="advice-icon">${a.icon}</span>
          <span class="advice-text">${a.text}</span>
        </div>`).join("")}
    </div>
  </div>
  `;
}

init();
</script>
</body>
</html>
