<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>퇴직연금 분석 · Z계좌</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&display=swap');

:root {
  --bg: #080c12;
  --bg2: #0e1420;
  --bg3: #141c2a;
  --border: #1e2d42;
  --border2: #243347;
  --text: #d4dde8;
  --text2: #7a95ae;
  --text3: #4a6278;
  --gold: #f0a832;
  --gold2: #c47e10;
  --green: #34d47a;
  --red: #f05252;
  --blue: #4a90d9;
  --purple: #9b72e8;
  --orange: #f07832;
  --teal: #34c4b4;
  --safe: #4a90d9;
  --domestic: #34d47a;
  --overseas: #9b72e8;
  --theme: #f07832;
}

* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  background: var(--bg);
  color: var(--text);
  font-family: 'Noto Sans KR', sans-serif;
  font-size: 14px;
  min-height: 100vh;
  padding: 0 0 60px;
}

/* ── 헤더 ── */
.header {
  background: linear-gradient(135deg, #0e1a2e 0%, #0a1220 100%);
  border-bottom: 1px solid var(--border);
  padding: 14px 16px 10px;
  position: sticky; top: 0; z-index: 100;
  backdrop-filter: blur(12px);
}
.header-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 4px; }
.header-title { font-size: 15px; font-weight: 700; color: var(--gold); letter-spacing: -0.3px; }
.header-sub { font-size: 11px; color: var(--text3); font-family: 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif; }
.refresh-btn {
  background: #00ff8815; border: 1px solid #00ff8840;
  border-radius: 8px; color: #00ff88;
  padding: 8px 14px; font-size: 13px; cursor: pointer;
  font-family: 'Noto Sans KR', sans-serif; white-space: nowrap;
}
.refresh-btn:hover { background: #00ff8825; }

/* ── 요약 카드 행 ── */
.summary-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; padding: 14px 16px 0; }
.sum-card {
  background: var(--bg2); border: 1px solid var(--border);
  border-radius: 10px; padding: 10px 10px;
  overflow: hidden; min-width: 0;
}
.sum-label { font-size: 10px; color: var(--text3); margin-bottom: 4px; letter-spacing: 0.3px; white-space: nowrap; }
.sum-val { font-size: 14px; font-weight: 700; font-family: 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.sum-sub { font-size: 10px; color: var(--text3); margin-top: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pos { color: var(--green); }
.neg { color: var(--red); }
.neu { color: var(--text); }

/* ── 섹션 ── */
.section { padding: 16px 16px 0; }
.sec-title {
  font-size: 12px; color: var(--text3); letter-spacing: 1px;
  text-transform: uppercase; margin-bottom: 10px;
  display: flex; align-items: center; gap: 6px;
}
.sec-title::after { content:''; flex:1; height:1px; background: var(--border); }

/* ── 도넛 + 범례 ── */
.donut-area { display: flex; align-items: center; gap: 20px; }
.donut-wrap { position: relative; flex-shrink: 0; }
.donut-center {
  position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%);
  text-align: center;
}
.donut-center-val { font-size: 16px; font-weight: 700; font-family: 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif; color: var(--text); }
.donut-center-label { font-size: 11px; color: var(--text3); margin-top: 1px; }
.legend-list { flex: 1; display: flex; flex-direction: column; gap: 10px; }
.leg { display: flex; align-items: center; gap: 8px; }
.leg-dot { width: 11px; height: 11px; border-radius: 50%; flex-shrink: 0; }
.leg-name { flex: 1; color: var(--text2); font-size: 13px; }
.leg-pct { font-family: 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif; font-size: 13px; font-weight: 600; }
.leg-amt { font-size: 11px; color: var(--text3); margin-left: 4px; }

/* ── 바 차트 ── */
.bar-item { margin-bottom: 10px; }
.bar-top { display: flex; justify-content: space-between; font-size: 12px; margin-bottom: 4px; }
.bar-name { color: var(--text2); }
.bar-right { color: var(--text3); font-family: 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif; }
.bar-track { background: var(--bg3); border-radius: 3px; height: 7px; overflow: hidden; }
.bar-fill { height: 100%; border-radius: 3px; transition: width 0.8s cubic-bezier(.4,0,.2,1); }

/* ── 추천 비교 ── */
.compare-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.cmp-card { background: var(--bg2); border: 1px solid var(--border); border-radius: 10px; padding: 12px; }
.cmp-title { font-size: 11px; color: var(--text3); margin-bottom: 8px; letter-spacing: 0.5px; }
.cmp-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 7px; font-size: 13px; }
.cmp-cat { color: var(--text2); display: flex; align-items: center; gap: 5px; }
.cmp-dot { width: 8px; height: 8px; border-radius: 50%; }
.cmp-val { font-family: 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif; font-weight: 600; }
.over  { color: var(--red); }
.under { color: var(--gold); }
.ok    { color: var(--green); }

/* ── 갭 화살표 ── */
.gap-list { display: flex; flex-direction: column; gap: 7px; }
.gap-row {
  background: var(--bg2); border: 1px solid var(--border);
  border-radius: 8px; padding: 10px 13px;
  display: flex; align-items: center; gap: 8px;
}
.gap-cat { display: flex; align-items: center; gap: 6px; flex: 1; font-size: 13px; color: var(--text2); }
.gap-now { font-family: 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif; font-size: 13px; font-weight: 600; }
.gap-arrow { font-size: 12px; color: var(--text3); }
.gap-target { font-family: 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif; font-size: 12px; color: var(--text3); }
.gap-diff { font-size: 11px; font-family: 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif; }

/* ── 안전진단 스코어 ── */
.score-box {
  background: var(--bg2); border: 1px solid var(--border);
  border-radius: 12px; padding: 16px;
}
.score-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
.score-label { font-size: 13px; color: var(--text2); }
.score-num { font-size: 30px; font-weight: 700; font-family: 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif; }
.score-grade { font-size: 13px; margin-left: 6px; }
.score-bar-track { background: var(--bg3); border-radius: 4px; height: 8px; margin-bottom: 12px; overflow: hidden; }
.score-bar-fill { height: 100%; border-radius: 4px; transition: width 1s ease; }
.score-items { display: flex; flex-direction: column; gap: 7px; }
.score-item { display: flex; justify-content: space-between; font-size: 12px; }
.score-item-label { color: var(--text3); }
.score-item-val { font-family: 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif; font-weight: 600; }
.check { color: var(--green); }
.warn  { color: var(--gold); }
.fail  { color: var(--red); }

/* ── 종목 테이블 ── */
.stock-table { width: 100%; border-collapse: collapse; table-layout: fixed; }
.stock-table th {
  font-size: 10px; color: var(--text3); text-align: left;
  padding: 7px 6px; border-bottom: 1px solid var(--border);
  letter-spacing: 0.3px; font-weight: 400;
}
.stock-table td {
  padding: 8px 6px; border-bottom: 1px solid var(--border);
  font-size: 11px; vertical-align: middle; overflow: hidden;
}
.stock-table tr:last-child td { border-bottom: none; }
.td-name { color: var(--text); font-weight: 500; word-break: break-all; line-height: 1.4; width: 36%; }
.td-num { font-family: 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif; text-align: right; font-size: 11px; white-space: nowrap; }
.td-pct { font-family: 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif; text-align: right; font-weight: 700; font-size: 11px; line-height: 1.5; }

/* ── 조언 카드 ── */
.advice-list { display: flex; flex-direction: column; gap: 8px; }
.advice-card {
  border-radius: 8px; padding: 11px 13px;
  display: flex; gap: 10px; align-items: flex-start;
  font-size: 13px; line-height: 1.65;
}
.advice-icon { font-size: 15px; flex-shrink: 0; margin-top: 1px; }
.advice-text { color: var(--text2); }
.advice-text strong { color: var(--text); }
.card-red    { background: #f0525210; border: 1px solid #f0525230; }
.card-gold   { background: #f0a83210; border: 1px solid #f0a83230; }
.card-green  { background: #34d47a10; border: 1px solid #34d47a30; }
.card-blue   { background: #4a90d910; border: 1px solid #4a90d930; }

.no-data { text-align: center; padding: 40px 20px; color: var(--text3); font-size: 14px; }

/* ── 거래일지 평가손익 섹션 ── */
.jrnl-tabs {
  display: flex; gap: 0;
  background: var(--bg3); border: 1px solid var(--border);
  border-radius: 8px; padding: 3px; margin-bottom: 10px;
}
.jrnl-tab {
  flex: 1; text-align: center; padding: 7px 4px;
  font-size: 12px; font-weight: 600;
  border-radius: 6px; cursor: pointer; border: none;
  background: transparent; color: var(--text3);
  font-family: inherit; transition: all 0.15s;
}
.jrnl-tab.active { background: var(--bg2); color: var(--gold); }
.jrnl-pnl-card {
  border-radius: 10px; padding: 10px 10px; margin-bottom: 8px;
  background: var(--bg2); border: 1px solid var(--border);
}
.jrnl-pnl-label { font-size: 10px; color: var(--text3); letter-spacing: 0.3px; margin-bottom: 4px; white-space: nowrap; }
.jrnl-pnl-val   { font-size: 14px; font-weight: 700; }
.jrnl-pnl-sub   { font-size: 10px; color: var(--text3); margin-top: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.jrnl-link-btn {
  display: block; width: 100%;
  background: #f59e0b15; border: 1px solid #f59e0b40; color: var(--gold);
  border-radius: 8px; padding: 10px; text-align: center;
  font-size: 13px; font-weight: 700; cursor: pointer;
  font-family: inherit; margin-top: 4px;
  text-decoration: none;
}
.jrnl-link-btn:hover { background: #f59e0b25; }

/* ── 거래 목록 (인라인) ── */
.jrnl-merge-row { display:flex; justify-content:flex-end; margin-bottom:8px; }
.jrnl-merge-btn {
  font-size:11px; background:#1e293b; border:1px solid #334155;
  border-radius:6px; color:#94a3b8; padding:5px 12px;
  cursor:pointer; font-family:inherit; transition:all 0.15s;
}
.jrnl-date-group { margin-bottom:8px; border:1px solid var(--border); border-radius:10px; overflow:hidden; }
.jrnl-date-hdr {
  display:flex; justify-content:space-between; align-items:center;
  padding:10px 14px; cursor:pointer; background:var(--bg); user-select:none;
}
.jrnl-date-hdr:active { background:#0d1f2e; }
.jrnl-date-hdr-left { display:flex; align-items:center; gap:8px; }
.jrnl-date-label { font-size:13px; font-weight:700; color:#c8d8e8; }
.jrnl-date-cnt { font-size:11px; color:#5a6b7e; background:#1a2535; border-radius:4px; padding:1px 7px; }
.jrnl-date-hdr-right { display:flex; align-items:center; gap:8px; }
.jrnl-date-amt { font-size:12px; font-weight:700; }
.jrnl-date-arrow { font-size:11px; color:#5a6b7e; transition:transform 0.2s; display:inline-block; }
.jrnl-date-arrow.open { transform:rotate(180deg); }
.jrnl-date-body { overflow:hidden; transition:max-height 0.25s ease, opacity 0.2s; }
.jrnl-date-body.collapsed { max-height:0 !important; opacity:0; }
.jrnl-date-inner { padding:8px 10px 10px; display:flex; flex-direction:column; gap:6px; background:var(--bg2); }
.jrnl-tx-row {
  display:flex; justify-content:space-between; align-items:center;
  background:var(--bg); border:1px solid var(--border);
  border-radius:8px; padding:10px 13px;
}
.jrnl-tx-left { display:flex; align-items:center; gap:9px; min-width:0; }
.jrnl-tx-tag { font-size:11px; font-weight:700; border-radius:4px; padding:2px 7px; flex-shrink:0; }
.jrnl-tx-info { min-width:0; overflow:hidden; }
.jrnl-tx-name { font-size:14px; font-weight:700; color:#f1f5f9; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.jrnl-tx-sub { font-size:11px; color:var(--gold); margin-top:1px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.jrnl-tx-right { text-align:right; flex-shrink:0; margin-left:8px; }
.jrnl-tx-amt { font-size:14px; font-weight:700; }
.jrnl-tx-qty { font-size:11px; color:#7a95ae; margin-top:1px; }
.jrnl-no-tx { text-align:center; padding:30px 16px; color:var(--text3); font-size:13px; }
</style>
</head>

// ── 커스텀 분류 (localStorage pf_retire_sector) ──
const CAT_COLOR_MAP = {

  "펀드":    "var(--teal)",
};
function loadCustomSectors() {

}
function saveCustomSector(code, name, cat) {
  const custom = loadCustomSectors();
  custom[code] = { name, cat, color: CAT_COLOR_MAP[cat] || "#888" };
  localStorage.setItem("pf_retire_sector", JSON.stringify(custom));
}
// 우선순위: 내장 SECTOR → localStorage 커스텀 → null(미분류)
function getSec(code, name) {
  if (SECTOR[code]) return SECTOR[code];
  const custom = loadCustomSectors();
  if (custom[code]) return custom[code];
  return null;
}
const CAT_COLORS = {
  "안전자산": "var(--safe)",
  "국내지수": "var(--domestic)",
  "해외지수": "var(--overseas)",
  "테마":    "var(--theme)",
  "펀드":    "var(--teal)",
};
const CAT_ORDER = ["안전자산", "국내지수", "해외지수", "테마", "펀드"];
const TARGET = { "안전자산": 30, "국내지수": 25, "해외지수": 25, "테마": 20, "펀드": 0 };

// ── 거래 내역 → 평균단가/잔량 계산 ──
function calcAvg(txs) {
  let qty = 0, cost = 0;
  (txs || []).forEach(t => {
    if (t.type === "buy")  { cost += t.price * t.qty; qty += t.qty; }
    if (t.type === "sell") { cost -= (cost / qty) * t.qty; qty -= t.qty; }
  });
  return { qty, avg: qty > 0 ? cost / qty : 0 };
}
function realizedPnl(txs) {
  let qty = 0, cost = 0, realized = 0;
  (txs || []).forEach(t => {
    if (t.type === "buy")  { cost += t.price * t.qty; qty += t.qty; }
    if (t.type === "sell") {
      const avgCost = qty > 0 ? cost / qty : 0;
      realized += (t.price - avgCost) * t.qty;
      cost -= avgCost * t.qty; qty -= t.qty;
    }
  });
  return realized;
}

function fmt(n) { return Math.abs(n) >= 10000 ? (n/10000).toFixed(1)+"만" : n.toLocaleString(); }
function fmtW(n) { return "₩" + Math.round(n).toLocaleString(); }
function fmtPct(n) { return (n >= 0 ? "+" : "") + n.toFixed(2) + "%"; }

// ── 메인 초기화 ──
function init() {
  const stocks   = JSON.parse(localStorage.getItem("pf_stocks_v2")   || "[]");
  const prices   = JSON.parse(localStorage.getItem("pf_prices_v2")   || "{}");
  const funds    = JSON.parse(localStorage.getItem("pf_retire_funds") || "[]");
  const usdKrw   = parseFloat(localStorage.getItem("pf_usdkrw") || "1500");
  const now      = new Date();

  const zStocks = stocks.filter(s => (s.broker || "") === "Z");

  document.getElementById("headerSub").textContent =
    `${now.toLocaleDateString("ko-KR")} ${now.toLocaleTimeString("ko-KR", {hour:"2-digit",minute:"2-digit"})} 기준 · 종목 ${zStocks.length}개`;

  if (zStocks.length === 0) {
    document.getElementById("mainContent").innerHTML =
      `<div class="no-data">📭 Z계좌 종목이 없습니다.<br>포트폴리오 트래커에서 종목을 추가해 주세요.</div>`;
    return;
  }

  // ── 미분류 종목 감지 → 팝업 처리 ──

  zStocks.forEach(s => {
    const { qty } = calcAvg(s.transactions);
    if (qty <= 0) return;
    if (!getSec(s.code, s.name)) unknownStocks.push({ code: s.code, name: s.name });
  });

  if (unknownStocks.length > 0) {
    showSectorPopup(unknownStocks, () => init());
    return;
  }

  // ── 종목별 평가 계산 ──
  let rows = [];
  let totalCost = 0, totalVal = 0, totalRealized = 0;

  zStocks.forEach(s => {
    const { qty, avg } = calcAvg(s.transactions);
    if (qty <= 0) return;
    const fx  = s.market === "NASDAQ" ? usdKrw : 1;
    const cur = (prices[s.code] || 0);
    const cost = avg * qty * fx;
    const val  = cur * qty * fx;
    const pnl  = val - cost;
    const pct  = cost > 0 ? (pnl / cost * 100) : 0;
    const real = realizedPnl(s.transactions) * fx;
    const sec  = getSec(s.code, s.name) || { name: s.name, cat: "기타", color: "#888" };
    totalCost += cost; totalVal += val; totalRealized += real;
    rows.push({ code: s.code, name: s.name, cat: sec.cat, color: sec.color, qty, avg, cur, cost, val, pnl, pct, real });
  });

  // 펀드 (별도 섹터, evalAmt 있으면 손익 계산)
  funds.forEach(f => {
    if (f.amt <= 0) return;
    const evalAmt = f.evalAmt > 0 ? f.evalAmt : f.amt;
    const pnl  = evalAmt - f.amt;
    const pct  = f.amt > 0 ? pnl / f.amt * 100 : 0;
    totalCost += f.amt; totalVal += evalAmt;
    rows.push({ code: "FUND", name: f.name, cat: "펀드",
      color: "var(--teal)",
      qty: 1, avg: f.amt, cur: evalAmt, cost: f.amt, val: evalAmt, pnl, pct, real: 0,
      isFund: true });
  });

  rows.sort((a, b) => b.val - a.val);

  const totalPnl = totalVal - totalCost;
  const totalPct = totalCost > 0 ? (totalPnl / totalCost * 100) : 0;

  // ── 카테고리별 집계 ──
  const catMap = {};
  rows.forEach(r => {
    catMap[r.cat] = (catMap[r.cat] || 0) + r.val;
  });
  const catTotal = Object.values(catMap).reduce((a, b) => a + b, 0);

  // ── 안전진단 점수 (펀드 제외한 ETF 비중으로 계산) ──
  const etfTotal    = catTotal - (catMap["펀드"] || 0);
  const safeRatio   = etfTotal > 0 ? (catMap["안전자산"] || 0) / etfTotal * 100 : 0;
  const indexRatio  = etfTotal > 0 ? ((catMap["국내지수"] || 0) + (catMap["해외지수"] || 0)) / etfTotal * 100 : 0;
  const themeRatio  = etfTotal > 0 ? (catMap["테마"] || 0) / etfTotal * 100 : 0;
  const dupOverseas = rows.filter(r => r.cat === "해외지수").length >= 2;

  let score = 100;
  let scoreItems = [];

  // 안전자산 30% 이상
  if (safeRatio >= 30) {
    scoreItems.push({ icon: "✅", label: "안전자산 30% 이상", val: safeRatio.toFixed(1) + "%", cls: "check" });
  } else {
    score -= 20;
    scoreItems.push({ icon: "⚠️", label: "안전자산 부족 (30% 권장)", val: safeRatio.toFixed(1) + "%", cls: "warn" });
  }

  // 지수형 40% 이상
  if (indexRatio >= 40) {
    scoreItems.push({ icon: "✅", label: "지수형 ETF 40% 이상", val: indexRatio.toFixed(1) + "%", cls: "check" });
  } else {
    score -= 15;
    scoreItems.push({ icon: "⚠️", label: "지수형 ETF 부족 (40% 권장)", val: indexRatio.toFixed(1) + "%", cls: "warn" });
  }

  // 테마 30% 이하

    scoreItems.push({ icon: "❌", label: "테마 ETF 과다 (30% 초과)", val: themeRatio.toFixed(1) + "%", cls: "fail" });

    scoreItems.push({ icon: "⚠️", label: "해외지수 ETF 중복 보유", val: "나스닥+S&P500", cls: "warn" });

  } else if (safeRatio > 55) {
    advices.push({ type: "gold", icon: "🟡", text: "<strong>안전자산 비중이 권장치보다 높습니다.</strong> CD금리 ETF 매도로 확보한 자금을 지수형 ETF(TIGER200, 나스닥100)로 분산하면 장기 수익률을 높일 수 있어요." });
  } else {
    advices.push({ type: "green", icon: "🟢", text: "<strong>안전자산 비중이 적정합니다.</strong> 현재 구조를 유지하세요." });
  }

  if (dupOverseas) {
    advices.push({ type: "gold", icon: "🟡", text: "<strong>나스닥100과 S&P500을 동시에 보유 중입니다.</strong> 두 지수는 90% 이상 겹칩니다. 하나로 통일하면 집중도를 높이고 관리도 쉬워져요. 성장성은 나스닥100, 안정성은 S&P500이 우선입니다." });
  }

  const worstStock = rows.filter(r => r.pct < -10);
  if (worstStock.length > 0) {
    const ws = worstStock[0];
    advices.push({ type: "red", icon: "🔴", text: `<strong>${ws.name}</strong>이(가) ${fmtPct(ws.pct)} 손실 중입니다. 테마의 장기 유효성이 살아있으면 홀드, 논리가 무너졌으면 손절을 고려하세요.` });
  }

  if (themeRatio > 25) {
    advices.push({ type: "gold", icon: "🟡", text: `<strong>테마 ETF 비중이 ${themeRatio.toFixed(1)}%로 높습니다.</strong> 퇴직연금 특성상 20% 이내 유지를 권장합니다. 단기 급등한 테마는 일부 차익실현 후 지수형으로 이동하는 전략을 고려하세요.` });
  }

  advices.push({ type: "blue", icon: "💡", text: "<strong>퇴직연금은 지루할수록 잘 굴리는 겁니다.</strong> 월 1~2회 정도 꾸준한 적립식이 장기적으로 가장 효과적이에요. 잦은 매수보다 구조를 잡고 기다리는 게 맞습니다." });

  // ── 도넛 SVG 생성 ──
  function buildDonut(w, h, r, strokeW) {
    const cx = w / 2, cy = h / 2;
    const circ = 2 * Math.PI * r;
    let offset = 0;
    let paths = `<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="#1a2535" stroke-width="${strokeW}"/>`;
    CAT_ORDER.forEach(cat => {
      if (!catMap[cat]) return;
      const pct = catMap[cat] / catTotal;
      const dash = pct * circ;
      const gap  = circ - dash;
      paths += `<circle cx="${cx}" cy="${cy}" r="${r}" fill="none"
        stroke="${CAT_COLORS[cat]}" stroke-width="${strokeW}"
        stroke-dasharray="${dash.toFixed(2)} ${gap.toFixed(2)}"
        stroke-dashoffset="${(circ * 0.25 - offset).toFixed(2)}"
        style="transition:stroke-dasharray 0.8s ease"/>`;
      offset += dash;
    });
    return `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}">${paths}</svg>`;
  }

  // ── HTML 렌더링 ──
  document.getElementById("mainContent").innerHTML = `

  <!-- 요약 카드 -->
  <div class="summary-row">
    <div class="sum-card">
      <div class="sum-label">총 평가금액</div>
      <div class="sum-val neu" style="font-size:12px">${fmtW(totalVal)}</div>
      <div class="sum-sub">매입 ${fmtW(totalCost)}</div>

      <div class="sum-sub ${totalPct >= 0 ? "pos" : "neg"}">${fmtPct(totalPct)}</div>
    </div>
    <div class="sum-card">
      <div class="sum-label">안전진단</div>
      <div class="sum-val" style="color:${scoreGrade.color};font-size:16px">${score}<span style="font-size:10px"> /100</span></div>
      <div class="sum-sub" style="color:${scoreGrade.color}">${scoreGrade.label}</div>

        </div>
      </div>
      <div class="legend-list">
        ${CAT_ORDER.map(cat => {
          const val = catMap[cat] || 0;
          const pct = catTotal > 0 ? val / catTotal * 100 : 0;
          if (!val) return "";
          return `<div class="leg">

          const pct = etfTotal > 0 ? (catMap[cat] || 0) / etfTotal * 100 : 0;

        }).join("")}
      </div>
      <div class="cmp-card">
        <div class="cmp-title">▪ 추천</div>
        ${CAT_ORDER.filter(c => c !== "펀드").map(cat => `

          <div class="gap-cat"><span class="cmp-dot" style="background:${CAT_COLORS[cat]};display:inline-block;width:8px;height:8px;border-radius:50%"></span>${cat}</div>

        return `<div class="gap-row">
          <div class="gap-cat"><span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:${CAT_COLORS[cat]}"></span>${cat}</div>
          <span class="gap-now ${diff > 0 ? "over" : "under"}">${pct.toFixed(1)}%</span>
          <span class="gap-arrow">${diff > 0 ? "▼" : "▲"}</span>
          <span class="gap-target">${tgt}%</span>
          <span class="gap-diff ${diff > 0 ? "over" : "under"}">${diff > 0 ? "+" : ""}${diff.toFixed(1)}%p ${diff > 0 ? "초과" : "부족"}</span>
        </div>`;
      }).join("")}
    </div>
  </div>

  <!-- 종목 상세 테이블 (섹터별 그룹) -->

            <th style="text-align:right">손익률</th>
          </tr>
        </thead>
        <tbody>
          ${CAT_ORDER.map(cat => {
            const catRows = rows.filter(r => r.cat === cat);
            if (!catRows.length) return "";
            const catColor = CAT_COLORS[cat];
            const catBg    = cat === "안전자산" ? "#4a90d920" :
                             cat === "국내지수" ? "#34d47a20" :
                             cat === "해외지수" ? "#9b72e820" : "#f0783220";
            const firstChar = cat[0];
            const catTotal2  = catRows.reduce((s, r) => s + r.val, 0);
            const catCost2   = catRows.reduce((s, r) => s + r.cost, 0);
            const catPnl2    = catTotal2 - catCost2;
            const catPnlPct2 = catCost2 > 0 ? catPnl2 / catCost2 * 100 : 0;
            const subPct     = catTotal > 0 ? catTotal2 / catTotal * 100 : 0;
            const pnlColor   = catPnl2 >= 0 ? "var(--green)" : "var(--red)";
            const pnlSign    = catPnl2 >= 0 ? "+" : "";
            return `
              <tr>
                <td colspan="5" style="padding:6px 10px 5px;background:${catBg};border-bottom:1px solid ${catColor}30">
                  <div style="display:flex;justify-content:space-between;align-items:center">
                    <div>
                      <span style="color:${catColor};font-size:11px;font-weight:600">${cat}</span>
                      <span style="color:${catColor}80;font-size:10px;margin-left:6px">${subPct.toFixed(1)}% · ${fmtW(catTotal2)}</span>
                    </div>
                    <div style="text-align:right">
                      <span style="color:${pnlColor};font-size:11px;font-weight:600">${pnlSign}${catPnlPct2.toFixed(2)}%</span>
                      <br><span style="color:${pnlColor};font-size:10px;opacity:0.8">${pnlSign}${Math.round(catPnl2).toLocaleString()}원</span>
                    </div>
                  </div>
                </td>
              </tr>
              ${catRows.map(r => `<tr>
                <td class="td-name" style="padding-left:14px">${r.name}</td>
                <td class="td-num">${r.qty % 1 === 0 ? r.qty : r.qty.toFixed(2)}</td>
                <td class="td-num">
                  ${r.avg.toLocaleString(undefined,{maximumFractionDigits:0})}
                  <br><span style="font-size:10px;color:var(--text2);font-weight:400">(${fmtW(r.cost)})</span>
                </td>
                <td class="td-num">${r.cur.toLocaleString(undefined,{maximumFractionDigits:0})}</td>
                <td class="td-pct ${r.pct >= 0 ? "pos" : "neg"}">
                  ${fmtPct(r.pct)}<br>
                  <span style="font-size:10px;font-weight:400;opacity:0.8">${r.pnl >= 0 ? "+" : ""}${Math.round(r.pnl).toLocaleString()}</span>
                </td>
              </tr>`).join("")}`;
          }).join("")}
        </tbody>
      </table>
    </div>
  </div>

  <!-- 안전진단 상세 -->
  <div class="section" style="margin-top:16px">
    <div class="sec-title">안전진단 상세</div>
    <div class="score-box">
      <div class="score-header">
        <span class="score-label">포트폴리오 안전 점수</span>
        <div>
          <span class="score-num" style="color:${scoreGrade.color}">${score}</span>
          <span class="score-grade" style="color:${scoreGrade.color}">/ 100 · ${scoreGrade.label}</span>
        </div>
      </div>
      <div class="score-bar-track">
        <div class="score-bar-fill" style="width:${score}%;background:${scoreGrade.color}"></div>
      </div>
      <div class="score-items">
        ${scoreItems.map(i => `
          <div class="score-item">
            <span class="score-item-label">${i.icon} ${i.label}</span>
            <span class="score-item-val ${i.cls}">${i.val}</span>
          </div>`).join("")}
      </div>
    </div>
  </div>

  <!-- 운용 조언 -->
  <div class="section" style="margin-top:16px;padding-bottom:20px">
    <div class="sec-title">운용 조언</div>
    <div class="advice-list">
      ${advices.map(a => `
        <div class="advice-card card-${a.type}">
          <span class="advice-icon">${a.icon}</span>

        </div>`).join("")}

  </div>
  `;
}

init();

let jrnlPanelOpen = false;

function toggleJrnlPanel() {
  jrnlPanelOpen = !jrnlPanelOpen;
  const panel = document.getElementById('jrnlSection');
  const btn   = document.getElementById('jrnlToggleBtn');
  panel.style.display = jrnlPanelOpen ? 'block' : 'none';
  btn.textContent = jrnlPanelOpen ? '📋 Z계좌 거래 내역 닫기' : '📋 Z계좌 거래 내역 보기';
  if (jrnlPanelOpen) renderJrnlList();
}

// ── Z계좌 거래일지 (인라인) ──
let jrnlTab   = 'today';
let jrnlMerge = false;
let jrnlOpenDates = new Set();

function todayStr2()     { return new Date().toISOString().slice(0,10); }
function mondayStr2()    { const d=new Date(); const day=d.getDay()||7; d.setDate(d.getDate()-(day-1)); return d.toISOString().slice(0,10); }
function firstOfMonth2() { const d=new Date(); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-01`; }

function getJrnlRange() {
  if (jrnlTab==='today') return { from: todayStr2(), to: todayStr2() };
  if (jrnlTab==='week')  return { from: mondayStr2(), to: todayStr2() };
  if (jrnlTab==='month') return { from: firstOfMonth2(), to: todayStr2() };
  const f = document.getElementById('jrnlFrom')?.value;
  const t = document.getElementById('jrnlTo')?.value;
  return { from: f||todayStr2(), to: t||todayStr2() };
}

function setJrnlTab(t) {
  jrnlTab = t;
  jrnlOpenDates = new Set();
  document.querySelectorAll('.jrnl-tab').forEach(b => b.classList.toggle('active', b.dataset.tab===t));
  const cr = document.getElementById('jrnlCustomRange');
  if (cr) cr.style.display = t==='custom' ? 'flex' : 'none';
  renderJrnlList();
}

function toggleJrnlMerge() {
  jrnlMerge = !jrnlMerge;
  const btn = document.getElementById('jrnlMergeBtn');
  if (btn) {
    btn.textContent       = jrnlMerge ? '합산 해제' : '합산하기';
    btn.style.background  = jrnlMerge ? '#f59e0b20' : '#1e293b';
    btn.style.borderColor = jrnlMerge ? '#f59e0b50' : '#334155';
    btn.style.color       = jrnlMerge ? 'var(--gold)' : '#94a3b8';
  }
  renderJrnlList();
}

function toggleJrnlDate(date) {
  const body  = document.getElementById('jbody_' + date);
  const arrow = document.getElementById('jarr_'  + date);
  if (!body) return;
  if (jrnlOpenDates.has(date)) {
    jrnlOpenDates.delete(date);
    body.style.maxHeight = '0'; body.classList.add('collapsed');
    if (arrow) arrow.classList.remove('open');
  } else {
    jrnlOpenDates.add(date);
    body.style.maxHeight = '4000px'; body.classList.remove('collapsed');
    if (arrow) arrow.classList.add('open');
  }
}

function fmtJrnlDate(s) {
  const d = new Date(s+'T00:00:00');
  const days = ['일','월','화','수','목','금','토'];
  const mm = d.getMonth()+1, dd = d.getDate(), dow = days[d.getDay()];
  const today = todayStr2();
  const yest  = (() => { const x=new Date(); x.setDate(x.getDate()-1); return x.toISOString().slice(0,10); })();
  const lbl   = s===today?' (오늘)':s===yest?' (어제)':'';
  return `${mm}월 ${dd}일 (${dow})${lbl}`;
}

function renderJrnlPnl() { renderJrnlList(); }

function renderJrnlList() {
  const stocks  = JSON.parse(localStorage.getItem('pf_stocks_v2')   || '[]');
  const archived= JSON.parse(localStorage.getItem('pf_archived_v2') || '[]');
  const prices  = JSON.parse(localStorage.getItem('pf_prices_v2')   || '{}');
  const { from, to } = getJrnlRange();

  // Z계좌 거래만 수집
  const allTx = [];
  [...stocks, ...archived].filter(s=>(s.broker||'')==='Z').forEach(s => {
    (s.transactions||[]).forEach(tx => {
      if (tx.date>=from && tx.date<=to) {
        allTx.push({
          ...tx,
          stockName: s.name, stockCode: s.code,
          totalAmt: tx.price * Number(tx.qty),
          totalQty: Number(tx.qty),
          avgPrice:  tx.price,
          curPrice:  prices[s.code] || 0,
          count: 1, _rawList: [tx],
        });
      }
    });
  });

  allTx.sort((a,b) => b.date.localeCompare(a.date) || (a.type==='sell'?-1:1));

  const buyTx  = allTx.filter(t=>t.type==='buy');
  const sellTx = allTx.filter(t=>t.type==='sell');
  let buyAmt=0; buyTx.forEach(t=>buyAmt+=t.totalAmt);

  // 평가손익
  let pnl = null;
  if (buyTx.length) {
    const map={};
    buyTx.forEach(tx=>{ const k=tx.stockCode; if(!map[k]) map[k]={cost:0,qty:0}; map[k].cost+=tx.price*Number(tx.qty); map[k].qty+=Number(tx.qty); });
    let sum=0, hasPrices=false;
    Object.entries(map).forEach(([code,v])=>{ const cur=prices[code]||0; if(cur>0){hasPrices=true; sum+=(cur-v.cost/v.qty)*v.qty;} });
    if(hasPrices) pnl=sum;
  }

  const tabWord  = jrnlTab==='today'?'당일':jrnlTab==='week'?'이번주':jrnlTab==='month'?'이번달':'기간';
  const pnlColor = pnl===null?'var(--text3)':pnl>=0?'var(--green)':'var(--red)';
  const pnlStr   = pnl===null?'시세 미등록':(pnl>=0?'+':'')+fmtW(Math.round(pnl));
  const pnlBc    = pnl===null?'var(--border)':pnl>=0?'#00ff8830':'#ff444430';

  // 합산 처리
  let displayTx;
  if (jrnlMerge) {
    const mm = new Map();
    allTx.forEach(tx => {
      const key = `${tx.date}__${tx.stockCode}__${tx.type}`;
      if (mm.has(key)) {
        const m = mm.get(key);
        m.totalAmt += tx.totalAmt; m.totalQty += tx.totalQty;
        m.count++; m.avgPrice = m.totalAmt / m.totalQty;
        m._rawList.push(tx);
      } else { mm.set(key, {...tx, count:1, _merged:true, _rawList:[tx]}); }
    });
    displayTx = [...mm.values()].sort((a,b)=>b.date.localeCompare(a.date)||(a.type==='sell'?-1:1));
  } else {
    displayTx = allTx.map(tx=>({...tx, _merged:false}));
  }

  // 날짜별 그룹
  const groups={};
  displayTx.forEach(tx=>{ if(!groups[tx.date]) groups[tx.date]=[]; groups[tx.date].push(tx); });
  const sortedDates = Object.keys(groups).sort((a,b)=>b.localeCompare(a));

  function txRowHtml(tx) {
    const isBuy   = tx.type==='buy';
    const tc      = isBuy?'#00ff88':'#ff4444';
    const bg      = isBuy?'#00ff8820':'#ff444420';
    const border  = isBuy?'#00ff8840':'#ff444440';
    const label   = isBuy?'매수':'매도';
    const amtStr  = '₩'+Math.round(tx.totalAmt).toLocaleString();
    const qtyStr  = tx.totalQty%1===0?tx.totalQty.toLocaleString()+'주':tx.totalQty.toFixed(4)+'주';

    let pnlInline='';
    if (isBuy) {
      const curP = prices[tx.stockCode]||0;
      if (curP>0 && tx.avgPrice>0) {
        const pct    = (curP-tx.avgPrice)/tx.avgPrice*100;
        const pnlAmt = (curP-tx.avgPrice)*tx.totalQty;
        const c      = pct>=0?'var(--green)':'var(--red)';
        const sign   = pct>=0?'+':'-';
        pnlInline = `<span style="color:${c};font-weight:700"> · ${pct>=0?'+':''}${pct.toFixed(1)}% ${sign}₩${Math.abs(Math.round(pnlAmt)).toLocaleString()}</span>`;
      }
    }
    // 단가 배지 (별도 줄로 표시)
    let priceLine = '';
    const curPriceStr = tx.curPrice > 0 ? '₩' + Math.round(tx.curPrice).toLocaleString() : '—';
    const curPart = `<span style="color:#64748b">현재 ${curPriceStr} · </span>`;
    if (jrnlMerge) {
      const countPart = tx.count > 1 ? `×${tx.count} ` : '';
      priceLine = `<div style="font-size:10px;color:#94a3b8;margin-top:2px">${curPart}${countPart}평균 ₩${Math.round(tx.avgPrice).toLocaleString()}</div>`;
    } else {
      priceLine = `<div style="font-size:10px;color:#5a6b7e;margin-top:2px">${curPart}단가 ₩${Math.round(tx.avgPrice).toLocaleString()}</div>`;
    }

    return `<div class="jrnl-tx-row">
      <div class="jrnl-tx-left">
        <span class="jrnl-tx-tag" style="background:${bg};border:1px solid ${border};color:${tc}">${label}</span>
        <div class="jrnl-tx-info">
          <div class="jrnl-tx-name">${tx.stockName}</div>
          <div class="jrnl-tx-sub">${tx.stockCode}${pnlInline}</div>
          ${priceLine}
        </div>
      </div>
      <div class="jrnl-tx-right">
        <div class="jrnl-tx-amt" style="color:${tc}">${amtStr}</div>
        <div class="jrnl-tx-qty">${qtyStr}</div>
      </div>
    </div>`;
  }

  let listHtml = '';
  if (!sortedDates.length) {
    listHtml = `<div class="jrnl-no-tx">📭 해당 기간에 거래 내역이 없습니다.</div>`;
  } else {
    sortedDates.forEach(date => {
      const txList  = groups[date];
      const rawCnt  = allTx.filter(t=>t.date===date).length;
      let dBuy=0, dSell=0;
      txList.forEach(tx=>{ if(tx.type==='buy') dBuy+=tx.totalAmt; else dSell+=tx.totalAmt; });
      let amtHtml='';
      if(dBuy>0&&dSell>0) amtHtml=`<span style="color:#00ff88">+₩${Math.round(dBuy).toLocaleString()}</span><span style="color:#5a6b7e"> / </span><span style="color:#ff6666">₩${Math.round(dSell).toLocaleString()}</span>`;
      else if(dBuy>0)      amtHtml=`<span style="color:#00ff88">+₩${Math.round(dBuy).toLocaleString()}</span>`;
      else                 amtHtml=`<span style="color:#ff6666">₩${Math.round(dSell).toLocaleString()}</span>`;
      const cntLabel = jrnlMerge ? `${txList.length}종목 (${rawCnt}건)` : `${rawCnt}건`;
      const isOpen   = jrnlOpenDates.has(date);

      listHtml += `<div class="jrnl-date-group">
        <div class="jrnl-date-hdr" onclick="toggleJrnlDate('${date}')">
          <div class="jrnl-date-hdr-left">
            <span class="jrnl-date-label">${fmtJrnlDate(date)}</span>
            <span class="jrnl-date-cnt">${cntLabel}</span>
          </div>
          <div class="jrnl-date-hdr-right">
            <span class="jrnl-date-amt">${amtHtml}</span>
            <span class="jrnl-date-arrow ${isOpen?'open':''}" id="jarr_${date}">▼</span>
          </div>
        </div>
        <div class="jrnl-date-body ${isOpen?'':'collapsed'}" id="jbody_${date}" style="max-height:${isOpen?'4000px':'0'}">
          <div class="jrnl-date-inner">
            ${txList.map(txRowHtml).join('')}
          </div>
        </div>
      </div>`;
    });
  }

  document.getElementById('jrnlSection').innerHTML = `
    <div class="sec-title" style="margin-bottom:8px">Z계좌 거래 내역</div>
    <div class="jrnl-tabs">
      <button class="jrnl-tab ${jrnlTab==='today'?'active':''}" data-tab="today" onclick="setJrnlTab('today')">오늘</button>
      <button class="jrnl-tab ${jrnlTab==='week'?'active':''}"  data-tab="week"  onclick="setJrnlTab('week')">이번 주</button>
      <button class="jrnl-tab ${jrnlTab==='month'?'active':''}" data-tab="month" onclick="setJrnlTab('month')">이번 달</button>
      <button class="jrnl-tab ${jrnlTab==='custom'?'active':''}" data-tab="custom" onclick="setJrnlTab('custom')">직접 ✏️</button>
    </div>
    <div id="jrnlCustomRange" style="display:${jrnlTab==='custom'?'flex':'none'};gap:6px;align-items:center;margin-bottom:10px">
      <input type="date" id="jrnlFrom" value="${from}" style="flex:1;background:var(--bg3);border:1px solid var(--border2);border-radius:7px;color:var(--text);font-size:12px;padding:7px 8px;font-family:inherit">
      <span style="color:var(--text3);font-size:12px">~</span>
      <input type="date" id="jrnlTo" value="${to}" style="flex:1;background:var(--bg3);border:1px solid var(--border2);border-radius:7px;color:var(--text);font-size:12px;padding:7px 8px;font-family:inherit">
      <button onclick="renderJrnlList()" style="background:#f59e0b15;border:1px solid #f59e0b40;color:var(--gold);border-radius:7px;padding:7px 12px;font-size:12px;font-weight:700;cursor:pointer;font-family:inherit">조회</button>
    </div>
    <div style="display:grid;grid-template-columns:1fr 2fr;gap:8px;margin-bottom:10px">
      <div class="sum-card" style="border-color:${pnlBc}">
        <div class="sum-label" style="color:${pnlColor}99">🏦 ${tabWord} 평가손익</div>
        <div class="sum-val" style="color:${pnlColor}">${pnlStr}</div>
        <div class="sum-sub">${allTx.length}건 · 현재가 기준</div>
      </div>
      <div class="sum-card">
        <div class="sum-label">거래 내역</div>
        <div class="sum-val neu" style="font-size:12px">매수 ${buyTx.length}건 · 매도 ${sellTx.length}건</div>
        <div class="sum-sub">${buyAmt>0?'매수금액 ₩'+Math.round(buyAmt).toLocaleString():'매수 없음'}</div>
      </div>
    </div>
    <div class="jrnl-merge-row">
      <button class="jrnl-merge-btn" id="jrnlMergeBtn" onclick="toggleJrnlMerge()"
        style="${jrnlMerge?'background:#f59e0b20;border-color:#f59e0b50;color:var(--gold)':''}">${jrnlMerge?'합산 해제':'합산하기'}</button>
    </div>
    ${listHtml}
  `;
}

// ── 미분류 종목 카테고리 팝업 ──
function showSectorPopup(unknownList, onComplete) {
  let currentIdx = 0;

  function renderPopup() {
    const stock = unknownList[currentIdx];
    const total = unknownList.length;
    const cats = ["안전자산", "국내지수", "해외지수", "테마", "펀드"];
    const catDesc = {
      "안전자산": "채권·CD금리·혼합형",
      "국내지수": "KOSPI·코스닥 지수",
      "해외지수": "미국·해외 지수",
      "테마":    "섹터·테마·레버리지",
      "펀드":    "퇴직연금 펀드",
    };

    let existing = document.getElementById('sectorPopupOverlay');
    if (existing) existing.remove();

    const overlay = document.createElement('div');
    overlay.id = 'sectorPopupOverlay';
    overlay.style.cssText = `
      position:fixed;inset:0;background:#000000cc;z-index:9999;
      display:flex;align-items:center;justify-content:center;padding:20px;
    `;

    overlay.innerHTML = `
      <div style="background:#0e1420;border:1px solid #f59e0b40;border-radius:16px;
                  width:100%;max-width:360px;padding:20px;box-shadow:0 8px 40px #000a">
        <div style="font-size:11px;color:#f59e0b;letter-spacing:1px;margin-bottom:14px">
          🗂 새 종목 분류 (${currentIdx+1}/${total})
        </div>
        <div style="font-size:16px;font-weight:700;color:#f1f5f9;margin-bottom:4px">${stock.name}</div>
        <div style="font-size:12px;color:#5a6b7e;margin-bottom:18px">${stock.code}</div>
        <div style="font-size:12px;color:#94a3b8;margin-bottom:12px">
          이 종목의 카테고리를 선택해 주세요.<br>
          <span style="color:#64748b">한 번 저장하면 다음부터 자동으로 분류됩니다.</span>
        </div>
        <div style="display:flex;flex-direction:column;gap:8px" id="catBtnGroup">
          ${cats.map(cat => `
            <button onclick="selectSectorCat('${stock.code}','${stock.name}','${cat}')"
              style="background:#0d1a2a;border:1px solid #1e3a5a;border-radius:10px;
                     color:#c8d8e8;padding:11px 14px;font-size:13px;font-family:inherit;
                     cursor:pointer;text-align:left;display:flex;justify-content:space-between;align-items:center;
                     transition:all 0.15s"
              onmouseover="this.style.background='#f59e0b15';this.style.borderColor='#f59e0b50'"
              onmouseout="this.style.background='#0d1a2a';this.style.borderColor='#1e3a5a'">
              <span style="font-weight:600">${cat}</span>
              <span style="font-size:11px;color:#5a6b7e">${catDesc[cat]}</span>
            </button>
          `).join('')}
        </div>
        <button onclick="skipSectorCat()" style="
          margin-top:14px;width:100%;background:transparent;border:1px solid #1e2d42;
          border-radius:8px;color:#5a6b7e;padding:9px;font-size:12px;
          font-family:inherit;cursor:pointer">나중에 하기</button>
      </div>
    `;
    document.body.appendChild(overlay);
  }

  window.selectSectorCat = function(code, name, cat) {
    saveCustomSector(code, name, cat);
    currentIdx++;
    if (currentIdx < unknownList.length) {
      renderPopup();
    } else {
      const overlay = document.getElementById('sectorPopupOverlay');
      if (overlay) overlay.remove();
      onComplete();
    }
  };

  window.skipSectorCat = function() {
    const overlay = document.getElementById('sectorPopupOverlay');
    if (overlay) overlay.remove();
    // 미분류 종목을 "기타"로 임시 저장 (다음 방문 시 다시 물어봄 방지용 플래그 없이)
    // → 저장하지 않고 그냥 기타로 렌더링만 하려면 onComplete 대신
    //   unknownList를 기타로 세팅해 재진입 방지 후 호출
    unknownList.forEach(s => {
      // 세션 내 임시 등록 (localStorage 미저장)
      if (!SECTOR[s.code]) SECTOR[s.code] = { name: s.name, cat: "기타", color: "#888" };
    });
    onComplete();
  };

  renderPopup();
}
</script>
</body>
</html>
