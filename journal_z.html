<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>전체 거래일지</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&display=swap');

:root {
  --bg:      #080c12;
  --bg2:     #0e1420;
  --bg3:     #141c2a;
  --border:  #1e2d42;
  --border2: #243347;
  --text:    #d4dde8;
  --text2:   #7a95ae;
  --text3:   #4a6278;
  --green:   #00ff88;
  --red:     #ff4444;
  --blue:    #00ccff;
  --purple:  #a78bfa;
  --gold:    #f59e0b;
}

* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  background: var(--bg);
  color: var(--text);
  font-family: 'Noto Sans KR', sans-serif;
  font-size: 14px;
  min-height: 100vh;
  padding-bottom: 60px;
}

/* ── 헤더 ── */
.header {
  background: linear-gradient(135deg, #0e1a2e 0%, #0a1220 100%);
  border-bottom: 1px solid var(--border);
  padding: 14px 16px 10px;
  position: sticky; top: 0; z-index: 100;
}
.header-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
.header-title { font-size: 15px; font-weight: 700; color: #e2e8f0; }
.header-sub { font-size: 11px; color: var(--text3); }

/* ── 계좌 탭 ── */
.account-tabs {
  display: flex; gap: 0;
  background: #0d1420; border: 1px solid #1a2535;
  border-radius: 10px; padding: 3px; margin-bottom: 10px;
}
.account-tab {
  flex: 1; text-align: center; padding: 8px 4px;
  font-size: 13px; font-weight: 700;
  border-radius: 7px; cursor: pointer; border: none;
  background: transparent; color: #5a6b7e;
  font-family: inherit; transition: all 0.15s;
}
.account-tab.active-all    { background: #1e293b; color: #e2e8f0; }
.account-tab.active-nonz   { background: #1e293b; color: var(--blue); }
.account-tab.active-z      { background: #1e293b; color: var(--gold); }

/* ── 기간 탭 ── */
.period-tabs {
  display: flex; gap: 0;
  background: #0d1420; border: 1px solid #1a2535;
  border-radius: 10px; padding: 3px; margin-bottom: 10px;
}
.period-tab {
  flex: 1; text-align: center; padding: 8px 4px;
  font-size: 13px; font-weight: 600;
  border-radius: 7px; cursor: pointer; border: none;
  background: transparent; color: #5a6b7e;
  font-family: inherit; transition: all 0.15s;
}
.period-tab.active { background: #1e293b; color: var(--green); }

/* ── 직접 기간 ── */
.custom-range {
  display: flex; gap: 6px; align-items: center;
  margin-bottom: 10px;
}
.custom-range input[type=date] {
  flex: 1; background: var(--bg2); border: 1px solid var(--border2);
  border-radius: 7px; color: var(--text); font-size: 12px;
  padding: 7px 8px; font-family: inherit;
}
.custom-range button {
  background: #00ff8815; border: 1px solid #00ff8840;
  color: var(--green); border-radius: 7px;
  padding: 7px 14px; font-size: 13px; font-weight: 700;
  cursor: pointer; font-family: inherit;
}

/* ── 요약 카드 ── */
.summary-row {
  display: grid; grid-template-columns: 1fr 1fr 1fr;
  gap: 8px; margin-bottom: 12px;
}
.sum-card {
  background: var(--bg2); border: 1px solid var(--border);
  border-radius: 10px; padding: 10px 12px;
}
.sum-label { font-size: 10px; color: var(--text3); letter-spacing: 1px; margin-bottom: 4px; }
.sum-val   { font-size: 14px; font-weight: 700; }
.sum-sub   { font-size: 10px; color: var(--text3); margin-top: 3px; }

/* 평가손익 카드 (전체 폭) */
.pnl-card {
  grid-column: 1 / -1;
  background: #0d1420; border-radius: 10px;
  padding: 12px 16px; margin-bottom: 4px;
}
.pnl-card-label { font-size: 11px; letter-spacing: 1px; margin-bottom: 4px; }
.pnl-card-val   { font-size: 18px; font-weight: 700; }
.pnl-card-sub   { font-size: 11px; color: var(--text3); margin-top: 3px; }

/* ── 날짜 그룹 ── */
.date-group {
  margin-bottom: 8px; border: 1px solid var(--border);
  border-radius: 10px; overflow: hidden;
}
.date-hdr {
  display: flex; justify-content: space-between; align-items: center;
  padding: 10px 14px; cursor: pointer;
  background: #080c14; user-select: none;
}
.date-hdr:active { background: #0d1f2e; }
.date-hdr-left   { display: flex; align-items: center; gap: 8px; }
.date-hdr-label  { font-size: 13px; font-weight: 700; color: #c8d8e8; }
.date-hdr-cnt    { font-size: 11px; color: var(--text3); background: #1a2535; border-radius: 4px; padding: 1px 7px; }
.date-hdr-right  { display: flex; align-items: center; gap: 8px; }
.date-hdr-amt    { font-size: 12px; font-weight: 700; }
.date-hdr-arrow  { font-size: 11px; color: var(--text3); transition: transform 0.2s; display: inline-block; }
.date-hdr-arrow.open { transform: rotate(180deg); }
.date-body       { overflow: hidden; transition: max-height 0.25s ease, opacity 0.2s; }
.date-body.collapsed { max-height: 0 !important; opacity: 0; }
.date-body-inner { padding: 8px 10px 10px; display: flex; flex-direction: column; gap: 6px; background: #0d1420; }

/* ── 거래 행 ── */
.tx-row {
  display: flex; justify-content: space-between; align-items: center;
  background: #080c14; border: 1px solid var(--border);
  border-radius: 8px; padding: 10px 13px;
}
.tx-left  { display: flex; align-items: center; gap: 9px; min-width: 0; }
.tx-tag   { font-size: 11px; font-weight: 700; border-radius: 4px; padding: 2px 7px; flex-shrink: 0; }
.tx-tag.buy  { background: #00ff8820; color: var(--green); border: 1px solid #00ff8840; }
.tx-tag.sell { background: #ff444420; color: var(--red);   border: 1px solid #ff444440; }
.tx-info  { min-width: 0; }
.tx-name  { font-size: 14px; font-weight: 700; color: #f1f5f9; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 160px; }
.tx-broker { font-size: 11px; color: var(--purple); margin-top: 1px; }
.tx-broker.z { color: var(--gold); }
.tx-right { text-align: right; flex-shrink: 0; margin-left: 8px; }
.tx-price { font-size: 13px; font-weight: 700; }
.tx-qty   { font-size: 11px; color: var(--text3); margin-top: 2px; }

.no-data  { text-align: center; padding: 50px 20px; color: var(--text3); font-size: 14px; line-height: 2; }

.section  { padding: 0 16px; }
.range-label { font-size: 11px; color: var(--text3); text-align: right; margin-bottom: 8px; margin-top: -4px; }
</style>
</head>
<body>

<div class="header">
  <div class="header-top">
    <div class="header-title">📋 전체 거래일지</div>
    <div class="header-sub" id="headerSub">로딩 중...</div>
  </div>

  <!-- 계좌 탭 -->
  <div class="account-tabs" id="accountTabs">
    <button class="account-tab active-all" data-acct="all"  onclick="setAcct('all')">전체</button>
    <button class="account-tab"            data-acct="nonz" onclick="setAcct('nonz')">일반계좌</button>
    <button class="account-tab"            data-acct="z"    onclick="setAcct('z')">🏦 Z계좌</button>
  </div>

  <!-- 기간 탭 -->
  <div class="period-tabs" id="periodTabs">
    <button class="period-tab active" data-tab="today" onclick="setTab('today')">오늘</button>
    <button class="period-tab"        data-tab="week"  onclick="setTab('week')">이번 주</button>
    <button class="period-tab"        data-tab="month" onclick="setTab('month')">이번 달</button>
    <button class="period-tab"        data-tab="custom" onclick="setTab('custom')">직접 ✏️</button>
  </div>

  <!-- 직접 기간 -->
  <div class="custom-range" id="customRange" style="display:none">
    <input type="date" id="customFrom">
    <span style="color:var(--text3);font-size:12px">~</span>
    <input type="date" id="customTo">
    <button onclick="applyCustom()">조회</button>
  </div>
</div>

<div style="height:12px"></div>
<div class="section">
  <div id="summaryArea"></div>
  <div id="rangeLabel" class="range-label"></div>
  <div id="listArea"></div>
</div>

<script>
// ── 상태 ──
let acctFilter = 'all';   // all | nonz | z
let periodTab  = 'today'; // today | week | month | custom

// ── 날짜 유틸 ──
function todayStr() {
  return new Date().toISOString().slice(0, 10);
}
function mondayStr() {
  const d = new Date();
  const day = d.getDay() || 7;
  d.setDate(d.getDate() - (day - 1));
  return d.toISOString().slice(0, 10);
}
function firstOfMonth() {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-01`;
}
function getRange() {
  if (periodTab === 'today')  return { from: todayStr(), to: todayStr() };
  if (periodTab === 'week')   return { from: mondayStr(), to: todayStr() };
  if (periodTab === 'month')  return { from: firstOfMonth(), to: todayStr() };
  // custom
  const f = document.getElementById('customFrom').value;
  const t = document.getElementById('customTo').value;
  return { from: f || todayStr(), to: t || todayStr() };
}
function fmtDate(s) {
  const [y,m,d] = s.split('-');
  const days = ['일','월','화','수','목','금','토'];
  const dow = days[new Date(s).getDay()];
  return `${y}.${m}.${d} (${dow})`;
}
function fmt(n) {
  return Math.abs(n) >= 1e8
    ? (n/1e8).toFixed(2)+'억'
    : Math.abs(n) >= 1e4
    ? (n/1e4).toFixed(0)+'만'
    : Math.round(n).toLocaleString();
}

// ── 탭/필터 전환 ──
function setTab(t) {
  periodTab = t;
  document.querySelectorAll('.period-tab').forEach(b => b.classList.toggle('active', b.dataset.tab === t));
  document.getElementById('customRange').style.display = t === 'custom' ? 'flex' : 'none';
  render();
}
function setAcct(a) {
  acctFilter = a;
  document.querySelectorAll('.account-tab').forEach(b => {
    b.classList.remove('active-all','active-nonz','active-z');
    if (b.dataset.acct === a) b.classList.add('active-' + (a==='nonz'?'nonz':a==='z'?'z':'all'));
  });
  render();
}
function applyCustom() { render(); }

// ── 메인 렌더 ──
function render() {
  const stocks    = JSON.parse(localStorage.getItem('pf_stocks_v2')   || '[]');
  const archived  = JSON.parse(localStorage.getItem('pf_archived_v2') || '[]');
  const prices    = JSON.parse(localStorage.getItem('pf_prices_v2')   || '{}');
  const usdKrw    = parseFloat(localStorage.getItem('pf_usdkrw') || '1500');
  const { from, to } = getRange();

  // ── 전체 거래 수집 ──
  const allTx = [];
  [...stocks, ...archived].forEach(s => {
    (s.transactions || []).forEach(tx => {
      if (tx.date >= from && tx.date <= to) {
        allTx.push({
          ...tx,
          stockName: s.name,
          stockCode: s.code,
          market:    s.market || 'KS',
          broker:    s.broker || '',
          isZ:       (s.broker || '') === 'Z',
        });
      }
    });
  });

  // ── 계좌 필터 ──
  const filteredTx = acctFilter === 'all'  ? allTx
                   : acctFilter === 'z'    ? allTx.filter(t => t.isZ)
                   :                         allTx.filter(t => !t.isZ);

  filteredTx.sort((a,b) => b.date.localeCompare(a.date) || (a.type==='sell'?-1:1));

  // ── 헤더 서브 ──
  const now = new Date();
  document.getElementById('headerSub').textContent =
    `${now.toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit'})} 기준`;

  // ── 요약 계산 ──
  let buyCount=0, sellCount=0, buyKR=0, sellKR=0, buyUS=0, sellUS=0;
  filteredTx.forEach(tx => {
    const amt = tx.price * Number(tx.qty);
    const isUs = tx.market === 'NASDAQ';
    if (tx.type === 'buy')  { buyCount++;  if(isUs) buyUS+=amt;  else buyKR+=amt; }
    else                    { sellCount++; if(isUs) sellUS+=amt; else sellKR+=amt; }
  });
  const totalBuy  = buyKR  + buyUS  * usdKrw;
  const totalSell = sellKR + sellUS * usdKrw;

  // ── 평가손익 계산 (매수 종목별 집계) ──
  function calcPnl(txList) {
    const buyList = txList.filter(t => t.type === 'buy');
    if (!buyList.length) return null;
    const map = {};
    buyList.forEach(tx => {
      const key = tx.stockCode + '__' + tx.broker;
      if (!map[key]) map[key] = { cost:0, qty:0, market: tx.market };
      map[key].cost += tx.price * Number(tx.qty);
      map[key].qty  += Number(tx.qty);
    });
    let pnlKR=0, pnlUS=0, hasPrices=false;
    Object.entries(map).forEach(([key, v]) => {
      const code = key.split('__')[0];
      const cur  = prices[code] || 0;
      if (cur > 0) {
        hasPrices = true;
        const pnl = (cur - v.cost/v.qty) * v.qty;
        if (v.market === 'NASDAQ') pnlUS += pnl;
        else pnlKR += pnl;
      }
    });
    if (!hasPrices) return null;
    return pnlKR + pnlUS * usdKrw;
  }

  // 계좌 탭에 따라 평가손익 분리
  let pnlMain = null, pnlZ = null;
  if (acctFilter === 'all') {
    pnlMain = calcPnl(allTx.filter(t => !t.isZ));
    pnlZ    = calcPnl(allTx.filter(t =>  t.isZ));
  } else if (acctFilter === 'z') {
    pnlZ    = calcPnl(filteredTx);
  } else {
    pnlMain = calcPnl(filteredTx);
  }

  const tabWord = periodTab==='today' ? '당일' : periodTab==='week' ? '이번주' : periodTab==='month' ? '이번달' : '기간';

  // ── 요약 카드 HTML ──
  function pnlCardHtml(pnl, label, sub, isZ) {
    if (pnl === null) return '';
    const c = pnl >= 0 ? 'var(--green)' : 'var(--red)';
    const bc = isZ ? '#f59e0b40' : (pnl >= 0 ? '#00ff8830' : '#ff444430');
    const tc = isZ ? '#f59e0b' : c;
    return `<div class="pnl-card" style="border:1px solid ${bc}">
      <div class="pnl-card-label" style="color:${tc}99">${label}</div>
      <div class="pnl-card-val"   style="color:${tc}">${(pnl>=0?'+':'') + '₩' + fmt(Math.round(pnl))}</div>
      <div class="pnl-card-sub">${sub}</div>
    </div>`;
  }

  const buyAmtHtml = buyUS > 0
    ? `₩${fmt(Math.round(buyKR))}${buyKR>0?' + ':''}<span style="color:var(--blue)">$${buyUS.toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2})}</span>`
    : `₩${fmt(Math.round(buyKR))}`;
  const sellAmtHtml = sellUS > 0
    ? `₩${fmt(Math.round(sellKR))}${sellKR>0?' + ':''}<span style="color:#ff9999">$${sellUS.toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2})}</span>`
    : `₩${fmt(Math.round(sellKR))}`;

  document.getElementById('summaryArea').innerHTML = `
    <div class="summary-row">
      <div class="sum-card">
        <div class="sum-label">거래 건수</div>
        <div class="sum-val" style="color:var(--blue)">${filteredTx.length}건</div>
        <div class="sum-sub">매수 ${buyCount} · 매도 ${sellCount}</div>
      </div>
      <div class="sum-card">
        <div class="sum-label">매수 금액</div>
        <div class="sum-val" style="color:var(--green);font-size:${buyUS>0?'12px':'14px'}">${buyAmtHtml}</div>
        <div class="sum-sub">${buyCount}건${buyUS>0?' · NASDAQ포함':''}</div>
      </div>
      <div class="sum-card">
        <div class="sum-label">매도 금액</div>
        <div class="sum-val" style="color:var(--red);font-size:${sellUS>0?'12px':'14px'}">${sellAmtHtml}</div>
        <div class="sum-sub">${sellCount}건${sellUS>0?' · NASDAQ포함':''}</div>
      </div>
    </div>
    ${pnlCardHtml(pnlMain, `📊 ${tabWord} 매수 평가손익 (일반)`, '일반계좌 매수 종목 현재가 기준', false)}
    ${pnlCardHtml(pnlZ,    `🏦 ${tabWord} 매수 평가손익 (Z계좌)`, 'Z계좌 매수 종목 현재가 기준', true)}
  `;

  // ── 기간 레이블 ──
  document.getElementById('rangeLabel').textContent =
    from === to ? fmtDate(from) : `${from} ~ ${to}`;

  // ── 거래 없음 ──
  if (!filteredTx.length) {
    document.getElementById('listArea').innerHTML =
      `<div class="no-data">📭 해당 기간에 거래 내역이 없습니다.</div>`;
    return;
  }

  // ── 날짜별 그룹화 ──
  const dateMap = {};
  filteredTx.forEach(tx => {
    if (!dateMap[tx.date]) dateMap[tx.date] = [];
    dateMap[tx.date].push(tx);
  });

  const html = Object.entries(dateMap)
    .sort(([a],[b]) => b.localeCompare(a))
    .map(([date, txs]) => {
      const buyAmt  = txs.filter(t=>t.type==='buy').reduce((s,t)=>s+t.price*Number(t.qty),0);
      const sellAmt = txs.filter(t=>t.type==='sell').reduce((s,t)=>s+t.price*Number(t.qty),0);
      const amtStr  = buyAmt>0&&sellAmt>0
        ? `<span style="color:var(--green)">+${fmt(buyAmt)}</span> <span style="color:var(--text3)">·</span> <span style="color:var(--red)">-${fmt(sellAmt)}</span>`
        : buyAmt>0
        ? `<span style="color:var(--green)">매수 ${fmt(buyAmt)}</span>`
        : `<span style="color:var(--red)">매도 ${fmt(sellAmt)}</span>`;
      const id = 'dg_' + date.replace(/-/g,'');
      return `
        <div class="date-group">
          <div class="date-hdr" onclick="toggleGroup('${id}')">
            <div class="date-hdr-left">
              <span class="date-hdr-label">${fmtDate(date)}</span>
              <span class="date-hdr-cnt">${txs.length}건</span>
            </div>
            <div class="date-hdr-right">
              <span class="date-hdr-amt">${amtStr}</span>
              <span class="date-hdr-arrow" id="arr_${id}">▼</span>
            </div>
          </div>
          <div class="date-body collapsed" id="${id}" style="max-height:0">
            <div class="date-body-inner">
              ${txs.map(tx => {
                const amt   = tx.price * Number(tx.qty);
                const isUs  = tx.market === 'NASDAQ';
                const priceStr = isUs
                  ? `$${tx.price.toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2})}`
                  : `₩${fmt(tx.price)}`;
                const amtS = isUs
                  ? `$${amt.toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2})}`
                  : `₩${fmt(amt)}`;
                const brokerIsZ = tx.broker === 'Z';
                return `<div class="tx-row">
                  <div class="tx-left">
                    <span class="tx-tag ${tx.type}">${tx.type==='buy'?'매수':'매도'}</span>
                    <div class="tx-info">
                      <div class="tx-name">${tx.stockName}</div>
                      <div class="tx-broker ${brokerIsZ?'z':''}">${brokerIsZ ? '🏦 Z계좌' : (tx.broker || '—')}</div>
                    </div>
                  </div>
                  <div class="tx-right">
                    <div class="tx-price" style="color:${tx.type==='buy'?'var(--green)':'var(--red)'}">${amtS}</div>
                    <div class="tx-qty">${priceStr} × ${Number(tx.qty) % 1 === 0 ? Number(tx.qty) : Number(tx.qty).toFixed(6).replace(/\.?0+$/,'')}</div>
                  </div>
                </div>`;
              }).join('')}
            </div>
          </div>
        </div>`;
    }).join('');

  document.getElementById('listArea').innerHTML = html;
}

function toggleGroup(id) {
  const body = document.getElementById(id);
  const arr  = document.getElementById('arr_' + id);
  const collapsed = body.classList.toggle('collapsed');
  arr.classList.toggle('open', !collapsed);
  if (!collapsed) body.style.maxHeight = body.scrollHeight + 'px';
  else body.style.maxHeight = '0';
}

// ── 초기화 ──
(function() {
  // 직접 기간 기본값
  const t = new Date().toISOString().slice(0,10);
  document.getElementById('customFrom').value = t;
  document.getElementById('customTo').value   = t;
  render();
})();
</script>
</body>
</html>
