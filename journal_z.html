<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>전체 거래일지</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&display=swap');

:root {
  --bg:      #080c12;
  --bg2:     #0e1420;
  --bg3:     #141c2a;
  --border:  #1e2d42;
  --border2: #243347;
  --text:    #d4dde8;
  --text2:   #7a95ae;
  --text3:   #4a6278;
  --green:   #00ff88;
  --red:     #ff4444;
  --blue:    #00ccff;
  --purple:  #a78bfa;
  --gold:    #f59e0b;
}

* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  background: var(--bg);
  color: var(--text);
  font-family: 'Noto Sans KR', sans-serif;
  font-size: 14px;
  min-height: 100vh;
  padding-bottom: 60px;
}

/* ── 헤더 ── */
.header {
  background: linear-gradient(135deg, #0e1a2e 0%, #0a1220 100%);
  border-bottom: 1px solid var(--border);
  padding: 14px 16px 10px;
  position: sticky; top: 0; z-index: 100;
}
.header-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
.header-title { font-size: 15px; font-weight: 700; color: #e2e8f0; }
.header-sub { font-size: 11px; color: var(--text3); }

/* ── 기간 탭 ── */
.period-tabs {
  display: flex; gap: 0;
  background: #0d1420; border: 1px solid #1a2535;
  border-radius: 10px; padding: 3px; margin-bottom: 10px;
}
.period-tab {
  flex: 1; text-align: center; padding: 8px 4px;
  font-size: 13px; font-weight: 600;
  border-radius: 7px; cursor: pointer; border: none;
  background: transparent; color: #5a6b7e;
  font-family: inherit; transition: all 0.15s;
}
.period-tab.active { background: #1e293b; color: var(--green); }

/* ── 직접 기간 ── */
.custom-range {
  display: flex; gap: 6px; align-items: center;
  margin-bottom: 10px;
}
.custom-range input[type=date] {
  flex: 1; background: var(--bg2); border: 1px solid var(--border2);
  border-radius: 8px; color: var(--text); font-size: 13px;
  padding: 8px 10px; font-family: inherit; outline: none; min-width: 0;
}
.custom-range button.apply-btn {
  flex-shrink: 0; background: #00ff8820; border: 1px solid #00ff8840;
  color: var(--green); border-radius: 8px;
  padding: 8px 12px; font-size: 13px; font-weight: 700;
  cursor: pointer; font-family: inherit;
}
.hint-chips { display: flex; gap: 5px; flex-wrap: wrap; margin-top: 7px; }
.hint-chip {
  font-size: 11px; background: #1e293b; border: 1px solid #334155;
  border-radius: 5px; color: #94a3b8; padding: 4px 10px;
  cursor: pointer; font-family: inherit;
}

/* ── 서브 뷰탭 ── */
.view-tabs {
  display: flex; gap: 0;
  background: #080c14; border: 1px solid #1a2535;
  border-radius: 8px; padding: 3px; margin-bottom: 10px;
}
.view-tab {
  flex: 1; text-align: center; padding: 7px 4px;
  font-size: 12px; font-weight: 600;
  border-radius: 5px; cursor: pointer; border: none;
  background: transparent; color: #5a6b7e;
  font-family: inherit; transition: all 0.15s;
}
.view-tab.active { background: #1e293b; color: var(--green); }

/* ── 계좌 칩 영역 ── */
.filter-row {
  display: flex; justify-content: space-between; align-items: center;
  margin-bottom: 8px;
}
.broker-chips { display: flex; gap: 5px; flex-wrap: wrap; }
.merge-btn {
  flex-shrink: 0; margin-left: 8px; font-size: 11px;
  background: #1e293b; border: 1px solid #334155;
  border-radius: 6px; color: #94a3b8; padding: 5px 10px;
  cursor: pointer; font-family: inherit; transition: all 0.15s;
}

/* ── 요약 카드 ── */
.summary-row {
  display: grid; grid-template-columns: 1fr 1fr 1fr;
  gap: 8px; margin-bottom: 8px;
}
.sum-card {
  background: #080c14; border: 1px solid #1a2535;
  border-radius: 8px; padding: 10px 12px;
}
.sum-label { font-size: 11px; color: #5a6b7e; letter-spacing: 1px; margin-bottom: 4px; }
.sum-val   { font-size: 14px; font-weight: 700; }
.sum-sub   { font-size: 11px; color: #5a6b7e; margin-top: 2px; }

/* 평가손익 카드 (전체 폭) */
.pnl-card {
  grid-column: 1 / -1;
  background: #0d1420; border-radius: 10px;
  padding: 12px 16px; margin-bottom: 0;
}
.pnl-label { font-size: 11px; letter-spacing: 1px; margin-bottom: 4px; }
.pnl-val   { font-size: 18px; font-weight: 700; }
.pnl-sub   { font-size: 11px; color: #5a6b7e; margin-top: 3px; }

/* ── 날짜 그룹 ── */
.date-group {
  margin-bottom: 8px; border: 1px solid #1a2535;
  border-radius: 10px; overflow: hidden;
}
.date-hdr {
  display: flex; justify-content: space-between; align-items: center;
  padding: 10px 14px; cursor: pointer;
  background: #080c14; user-select: none;
}
.date-hdr:active { background: #0d1f2e; }
.date-hdr-left   { display: flex; align-items: center; gap: 8px; }
.date-hdr-label  { font-size: 13px; font-weight: 700; color: #c8d8e8; }
.date-hdr-cnt    { font-size: 11px; color: #5a6b7e; background: #1a2535; border-radius: 4px; padding: 1px 7px; }
.date-hdr-right  { display: flex; align-items: center; gap: 8px; }
.date-hdr-amt    { font-size: 12px; font-weight: 700; }
.date-hdr-arrow  { font-size: 11px; color: #5a6b7e; transition: transform 0.2s; display: inline-block; }
.date-hdr-arrow.open { transform: rotate(180deg); }
.date-body       { overflow: hidden; transition: max-height 0.25s ease, opacity 0.2s; opacity: 1; }
.date-body.collapsed { max-height: 0 !important; opacity: 0; }
.date-body-inner { padding: 8px 10px 10px; display: flex; flex-direction: column; gap: 6px; background: #0d1420; }

/* ── 거래 행 ── */
.tx-row {
  display: flex; justify-content: space-between; align-items: center;
  background: #080c14; border: 1px solid #1a2535;
  border-radius: 8px; padding: 10px 13px;
  cursor: pointer; transition: border-color 0.15s;
}
.tx-row:active { border-color: #334155; background: #0d1f2e; }
.tx-left  { display: flex; align-items: center; gap: 9px; min-width: 0; }
.tx-tag   { font-size: 11px; font-weight: 700; border-radius: 4px; padding: 2px 7px; flex-shrink: 0; }
.tx-info  { min-width: 0; overflow: hidden; }
.tx-name  { font-size: 14px; font-weight: 700; color: #f1f5f9; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tx-name-row { display: flex; align-items: baseline; gap: 0; overflow: hidden; }
.tx-broker { font-size: 11px; color: var(--purple); margin-top: 1px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tx-broker.z { color: var(--gold); }
.tx-right { text-align: right; flex-shrink: 0; margin-left: 8px; }
.tx-amt   { font-size: 14px; font-weight: 700; }
.tx-qty   { font-size: 11px; color: #7a95ae; margin-top: 1px; }

.no-data  { text-align: center; padding: 50px 20px; color: #5a6b7e; font-size: 14px; line-height: 2; }
.range-label { font-size: 11px; color: #5a6b7e; text-align: right; margin-bottom: 8px; margin-top: -4px; }

/* ── 상세 모달 ── */
.modal-bg {
  display: none; position: fixed; inset: 0;
  background: #000000cc; z-index: 200;
  align-items: flex-end; justify-content: center;
}
.modal-bg.open { display: flex; }
.modal {
  background: #0d1420; border: 1px solid #1a2535;
  border-radius: 16px 16px 0 0; padding: 24px 20px;
  width: 100%; max-width: 600px; max-height: 85vh; overflow-y: auto;
}
.modal-title { font-size: 12px; color: #7a95ae; letter-spacing: 2px; margin-bottom: 4px; }
.modal-name  { font-size: 16px; font-weight: 700; color: #f1f5f9; margin-bottom: 14px; }
.modal-actions { display: flex; gap: 8px; margin-top: 4px; }
.btn-cancel {
  flex: 1; background: #1a2535; border: none;
  border-radius: 8px; color: #7a95ae;
  padding: 13px; font-size: 14px; cursor: pointer; font-family: inherit;
}
.broker-tag {
  display: inline-block; font-size: 11px; color: var(--purple);
  background: #a78bfa15; border: 1px solid #a78bfa30;
  border-radius: 3px; padding: 1px 6px; margin-left: 6px; vertical-align: middle;
}
.jdetail-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 14px; }
.jdetail-item { background: #080c14; border: 1px solid #1a2535; border-radius: 8px; padding: 10px 12px; }
.jdetail-label { font-size: 11px; color: #5a6b7e; letter-spacing: 0.5px; margin-bottom: 4px; }
.jdetail-value { font-size: 15px; font-weight: 700; }
.jdetail-sub   { font-size: 11px; color: #7a95ae; margin-top: 2px; }
.jdetail-divider { height: 1px; background: #1a2535; margin: 12px 0; }

.section { padding: 0 16px; }
</style>
</head>
<body>

<div class="header">
  <div class="header-top">
    <div class="header-title">📋 전체 거래일지</div>
    <div class="header-sub" id="headerSub">로딩 중...</div>
  </div>

  <!-- 기간 탭 -->
  <div class="period-tabs">
    <button class="period-tab active" id="jtab_today"  onclick="setTab('today')">오늘</button>
    <button class="period-tab"        id="jtab_week"   onclick="setTab('week')">이번 주</button>
    <button class="period-tab"        id="jtab_month"  onclick="setTab('month')">이번 달</button>
    <button class="period-tab"        id="jtab_custom" onclick="setTab('custom')">직접 ✎</button>
  </div>

  <!-- 직접 기간 -->
  <div id="customRange" style="display:none">
    <div class="custom-range">
      <input type="date" id="dateFrom" onchange="render()">
      <span style="color:#5a6b7e;font-size:13px;flex-shrink:0">~</span>
      <input type="date" id="dateTo"   onchange="render()">
      <button class="apply-btn" onclick="render()">조회</button>
    </div>
    <div class="hint-chips" id="hintChips"></div>
  </div>

  <!-- 서브 뷰탭 -->
  <div class="view-tabs">
    <button class="view-tab active" id="jview_txn"  onclick="setView('txn')">거래 내역</button>
    <button class="view-tab"        id="jview_stat" onclick="setView('stat')">종목 통계</button>
  </div>

  <!-- 계좌 칩 + 합산 -->
  <div class="filter-row">
    <div class="broker-chips" id="brokerChips"></div>
    <button class="merge-btn" id="mergeBtn" onclick="toggleMerge()">합산 OFF</button>
  </div>
</div>

<!-- 상세 모달 -->
<div class="modal-bg" id="detailModal">
  <div class="modal" style="max-height:85vh">
    <div class="modal-title" id="dmTitle">거래 상세</div>
    <div class="modal-name"  id="dmName"></div>
    <div class="jdetail-grid" id="dmGrid"></div>
    <div class="jdetail-divider"></div>
    <div id="dmPnl"></div>
    <div class="modal-actions" style="margin-top:4px">
      <button class="btn-cancel" onclick="closeDetail()">닫기</button>
    </div>
  </div>
</div>

<div style="height:12px"></div>
<div class="section">
  <div class="summary-row" id="summaryArea" style="margin-bottom:8px"></div>
  <div class="range-label"  id="rangeLabel"></div>
  <div id="listArea"></div>
  <div id="statArea" style="display:none"></div>
</div>

<script>
// ── 상태 ──
let periodTab    = 'today';
let brokerFilter = 'all';
let mergeMode    = false;
let viewMode     = 'txn'; // txn | stat
let _openDates   = new Set();
let _txMap       = {};

// ── 유틸 ──
function fmt(n) { return Math.round(n).toLocaleString('ko-KR'); }

function fmtDate(s) {
  const d = new Date(s + 'T00:00:00');
  const days = ['일','월','화','수','목','금','토'];
  const mm = d.getMonth() + 1, dd = d.getDate(), dow = days[d.getDay()];
  const today = new Date().toISOString().slice(0,10);
  const yest  = offsetDate(new Date(), -1);
  let lbl = '';
  if (s === today) lbl = ' (오늘)';
  else if (s === yest) lbl = ' (어제)';
  return `${mm}월 ${dd}일 (${dow})${lbl}`;
}

function offsetDate(base, days) {
  const d = new Date(base);
  d.setDate(d.getDate() + days);
  return d.toISOString().slice(0,10);
}

function fmtAmt(amt, market) {
  if (market === 'NASDAQ')
    return '$' + amt.toLocaleString('en-US', {minimumFractionDigits:2, maximumFractionDigits:2});
  return '₩' + fmt(amt);
}

function fmtQty(q) {
  return q % 1 === 0 ? q.toLocaleString() + '주' : q.toFixed(4) + '주';
}

// ── 날짜 범위 ──
function getRange() {
  const now = new Date();
  const today = now.toISOString().slice(0,10);
  if (periodTab === 'today') return { from: today, to: today };
  if (periodTab === 'week') {
    const day = now.getDay(), diff = day === 0 ? 6 : day - 1;
    const mon = new Date(now); mon.setDate(now.getDate() - diff);
    return { from: mon.toISOString().slice(0,10), to: today };
  }
  if (periodTab === 'month') {
    return { from: `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-01`, to: today };
  }
  // custom
  const f = document.getElementById('dateFrom').value;
  const t = document.getElementById('dateTo').value;
  const from = f || today, to = t || today;
  return { from: from <= to ? from : to, to: from <= to ? to : from };
}

// ── 탭 전환 ──
function setTab(t) {
  periodTab = t;
  _openDates = new Set();
  ['today','week','month','custom'].forEach(id => {
    const el = document.getElementById('jtab_' + id);
    if (el) el.className = 'period-tab' + (id === t ? ' active' : '');
  });
  const cr = document.getElementById('customRange');
  if (cr) cr.style.display = t === 'custom' ? 'block' : 'none';
  if (t === 'custom') {
    const today = new Date().toISOString().slice(0,10);
    const fe = document.getElementById('dateFrom'), te = document.getElementById('dateTo');
    if (fe && !fe.value) fe.value = today;
    if (te && !te.value) te.value = today;
    renderHints();
  }
  render();
}

function setView(v) {
  viewMode = v;
  ['txn','stat'].forEach(id => {
    const el = document.getElementById('jview_' + id);
    if (el) el.className = 'view-tab' + (id === v ? ' active' : '');
  });
  document.getElementById('listArea').style.display = v === 'txn' ? '' : 'none';
  document.getElementById('statArea').style.display = v === 'stat' ? '' : 'none';
  if (v === 'stat') renderStat();
}

function setBroker(b) {
  brokerFilter = b;
  render();
}

function toggleMerge() {
  mergeMode = !mergeMode;
  const btn = document.getElementById('mergeBtn');
  if (btn) {
    btn.textContent = mergeMode ? '합산 ON' : '합산 OFF';
    btn.style.background   = mergeMode ? '#00ff8820' : '#1e293b';
    btn.style.borderColor  = mergeMode ? '#00ff8840' : '#334155';
    btn.style.color        = mergeMode ? '#00ff88'   : '#94a3b8';
  }
  render();
}

function renderHints() {
  const el = document.getElementById('hintChips');
  if (!el) return;
  const now = new Date(), today = now.toISOString().slice(0,10);
  const hints = [
    { label:'오늘',   from: today, to: today },
    { label:'3일',    from: offsetDate(now,-2), to: today },
    { label:'1주일',  from: offsetDate(now,-6), to: today },
    { label:'2주일',  from: offsetDate(now,-13), to: today },
    { label:'1개월',  from: offsetDate(now,-29), to: today },
    { label:'3개월',  from: offsetDate(now,-89), to: today },
    { label:'이번달', from: `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-01`, to: today },
    { label:'지난달',
      from: (() => { const d=new Date(now.getFullYear(),now.getMonth()-1,1); return d.toISOString().slice(0,10); })(),
      to:   (() => { const d=new Date(now.getFullYear(),now.getMonth(),0);   return d.toISOString().slice(0,10); })() },
  ];
  el.innerHTML = hints.map(h =>
    `<button class="hint-chip" onclick="applyHint('${h.from}','${h.to}')">${h.label}</button>`
  ).join('');
}

function applyHint(from, to) {
  const fe = document.getElementById('dateFrom'), te = document.getElementById('dateTo');
  if (fe) fe.value = from;
  if (te) te.value = to;
  render();
}

// ── calcAvg (FIFO 평균단가) ──
function calcAvg(txs) {
  let cost = 0, qty = 0;
  txs.forEach(t => {
    if (t.type === 'buy') {
      cost += t.price * Number(t.qty);
      qty  += Number(t.qty);
    } else {
      const avg = qty > 0 ? cost / qty : 0;
      cost -= avg * Number(t.qty);
      qty  -= Number(t.qty);
    }
  });
  return qty > 0 ? { avg: cost / qty, qty } : { avg: 0, qty: 0 };
}

function calcAvgAtDate(txs, upToDate) {
  let cost = 0, qty = 0;
  const sorted = [...txs].filter(t => t.date <= upToDate).sort((a,b) => a.date.localeCompare(b.date));
  sorted.forEach(t => {
    if (t.type === 'buy') {
      cost += t.price * Number(t.qty);
      qty  += Number(t.qty);
    } else {
      const avg = qty > 0 ? cost / qty : 0;
      cost -= avg * Number(t.qty);
      qty  -= Number(t.qty);
    }
  });
  return qty > 0 ? cost / qty : 0;
}

// ── 평가손익 계산 ──
// 주어진 매수 거래 목록에서 (code+broker 기준) 현재 평가손익 합산
// NASDAQ은 usdKrw 환산해 KRW 반환
function calcPnlFromBuys(buyTxs, prices, usdKrw) {
  if (!buyTxs.length) return null;
  const map = {};
  buyTxs.forEach(tx => {
    const key = tx.stockCode + '__' + (tx.broker || '');
    if (!map[key]) map[key] = { cost: 0, qty: 0, market: tx.market || 'KS' };
    map[key].cost += tx.price * Number(tx.qty);
    map[key].qty  += Number(tx.qty);
  });
  let total = 0, hasPrices = false;
  Object.entries(map).forEach(([key, v]) => {
    const code = key.split('__')[0];
    const cur  = prices[code] || 0;
    if (cur > 0) {
      hasPrices = true;
      const avgP = v.cost / v.qty;
      const pnl  = (cur - avgP) * v.qty;
      total += v.market === 'NASDAQ' ? pnl * usdKrw : pnl;
    }
  });
  return hasPrices ? total : null;
}

// ── 메인 렌더 ──
function render() {
  const stocks   = JSON.parse(localStorage.getItem('pf_stocks_v2')   || '[]');
  const archived = JSON.parse(localStorage.getItem('pf_archived_v2') || '[]');
  const prices   = JSON.parse(localStorage.getItem('pf_prices_v2')   || '{}');
  const usdKrw   = parseFloat(localStorage.getItem('pf_usdkrw') || '1500');
  const { from, to } = getRange();

  // 헤더 서브
  const now = new Date();
  document.getElementById('headerSub').textContent =
    now.toLocaleTimeString('ko-KR', {hour:'2-digit', minute:'2-digit'}) + ' 기준';

  // ── 전체 거래 수집 ──
  const allTx = [];
  stocks.concat(archived).forEach(s => {
    (s.transactions || []).forEach(tx => {
      if (tx.date >= from && tx.date <= to) {
        allTx.push({
          ...tx,
          stockName: s.name,
          stockCode: s.code,
          market:    s.market || 'KS',
          broker:    s.broker || '',
          isZ:       (s.broker || '') === 'Z',
          stockObj:  s,
        });
      }
    });
  });

  // ── 계좌 칩 렌더 ──
  const brokerSet = new Set(allTx.map(t => t.broker).filter(Boolean));
  const brokers   = [...brokerSet].sort();
  const chipsEl   = document.getElementById('brokerChips');
  if (chipsEl) {
    const chipCss = (b) => {
      const active = brokerFilter === b;
      return 'font-size:12px;font-weight:700;border-radius:6px;padding:5px 12px;cursor:pointer;font-family:inherit;transition:all 0.15s;'
        + (active
          ? 'background:#a78bfa30;border:1px solid #a78bfa80;color:#a78bfa'
          : 'background:#1e293b;border:1px solid #334155;color:#5a6b7e');
    };
    chipsEl.innerHTML =
      `<button style="${chipCss('all')}" onclick="setBroker('all')">전체</button>`
      + brokers.map(b => `<button style="${chipCss(b)}" onclick="setBroker('${b}')">${b}</button>`).join('');
  }

  // ── 브로커 필터 ──
  const filteredTx = brokerFilter === 'all'
    ? allTx
    : allTx.filter(t => t.broker === brokerFilter);

  filteredTx.sort((a,b) => b.date.localeCompare(a.date) || (a.type === 'sell' ? -1 : 1));

  // ── 합산 처리 ──
  let displayTx;
  if (mergeMode) {
    const mm = new Map();
    filteredTx.forEach(tx => {
      const key = `${tx.date}__${tx.stockCode}__${tx.broker}__${tx.type}`;
      if (mm.has(key)) {
        const m = mm.get(key);
        m.totalAmt += tx.price * Number(tx.qty);
        m.totalQty += Number(tx.qty);
        m.count++;
        m.avgPrice  = m.totalAmt / m.totalQty;
        m._rawList.push(tx);
      } else {
        mm.set(key, {
          ...tx,
          totalAmt: tx.price * Number(tx.qty),
          totalQty: Number(tx.qty),
          avgPrice: tx.price,
          count: 1,
          _merged: true,
          _rawList: [tx],
        });
      }
    });
    displayTx = [...mm.values()].sort((a,b) => b.date.localeCompare(a.date) || (a.type==='sell'?-1:1));
  } else {
    displayTx = filteredTx.map(tx => ({
      ...tx,
      totalAmt: tx.price * Number(tx.qty),
      totalQty: Number(tx.qty),
      avgPrice: tx.price,
      count: 1,
      _merged: false,
      _rawList: [tx],
    }));
  }

  // ── 요약 수치 계산 ──
  // NASDAQ 금액은 USD 그대로 합산, KRW는 따로 합산 후 최종 환산해서 합치기
  let buyCount=0, sellCount=0;
  let buyKrw=0, buyUsd=0, sellKrw=0, sellUsd=0;

  filteredTx.forEach(tx => {
    const amt  = tx.price * Number(tx.qty);
    const isUs = tx.market === 'NASDAQ';
    if (tx.type === 'buy') {
      buyCount++;
      if (isUs) buyUsd  += amt; else buyKrw  += amt;
    } else {
      sellCount++;
      if (isUs) sellUsd += amt; else sellKrw += amt;
    }
  });

  // 표시용 총액 (KRW 환산 합산)
  const totalBuyKrw  = buyKrw  + buyUsd  * usdKrw;
  const totalSellKrw = sellKrw + sellUsd * usdKrw;

  // ── 평가손익 계산 (일반/Z 분리) ──
  // 브로커 필터에 따라 계산 대상 결정
  const txForPnl = filteredTx; // 이미 필터된 것
  const nonZBuys = txForPnl.filter(t => t.type === 'buy' && !t.isZ);
  const zBuys    = txForPnl.filter(t => t.type === 'buy' &&  t.isZ);

  // 브로커 필터가 특정 계좌면 해당 부분만
  let pnlNonZ = null, pnlZ = null;
  if (brokerFilter === 'Z') {
    pnlZ = calcPnlFromBuys(zBuys, prices, usdKrw);
  } else if (brokerFilter === 'all') {
    pnlNonZ = calcPnlFromBuys(nonZBuys, prices, usdKrw);
    pnlZ    = calcPnlFromBuys(zBuys,    prices, usdKrw);
  } else {
    // 특정 일반 계좌
    pnlNonZ = calcPnlFromBuys(nonZBuys, prices, usdKrw);
  }

  // 탭 라벨
  const tabWord = periodTab === 'today' ? '당일'
                : periodTab === 'week'  ? '이번주'
                : periodTab === 'month' ? '이번달'
                : '기간';

  // 매수/매도 금액 표시 (NASDAQ 포함 시 별도 표기)
  function amtCardHtml(krw, usd, count, label, color) {
    let valHtml, subHtml;
    if (usd > 0 && krw > 0) {
      valHtml = `<span style="font-size:12px">₩${fmt(Math.round(krw))} <span style="color:var(--blue)">+$${usd.toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2})}</span></span>`;
      subHtml = `${count}건 · ≈₩${fmt(Math.round(krw + usd * usdKrw))}`;
    } else if (usd > 0) {
      valHtml = `<span style="color:var(--blue);font-size:12px">$${usd.toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2})}</span>`;
      subHtml = `${count}건 · ≈₩${fmt(Math.round(usd * usdKrw))}`;
    } else {
      valHtml = `₩${fmt(Math.round(krw))}`;
      subHtml = `${count}건`;
    }
    return `<div class="sum-card">
      <div class="sum-label">${label}</div>
      <div class="sum-val" style="color:${color}">${valHtml}</div>
      <div class="sum-sub">${subHtml}</div>
    </div>`;
  }

  function pnlCardHtml(pnl, label, sub, isZ) {
    if (pnl === null) return '';
    const c  = isZ ? 'var(--gold)' : (pnl >= 0 ? 'var(--green)' : 'var(--red)');
    const bc = isZ ? '#f59e0b40'   : (pnl >= 0 ? '#00ff8830'    : '#ff444430');
    const sign = pnl >= 0 ? '+' : '';
    return `<div class="pnl-card" style="border:1px solid ${bc};margin-top:8px">
      <div class="pnl-label" style="color:${c}99">${label}</div>
      <div class="pnl-val"   style="color:${c}">${sign}₩${fmt(Math.round(pnl))}</div>
      <div class="pnl-sub">${sub}</div>
    </div>`;
  }

  let summaryHtml = `
    <div class="sum-card">
      <div class="sum-label">거래 건수</div>
      <div class="sum-val" style="color:var(--blue)">${filteredTx.length}건</div>
      <div class="sum-sub">매수 ${buyCount} · 매도 ${sellCount}</div>
    </div>
    ${amtCardHtml(buyKrw,  buyUsd,  buyCount,  '매수 금액', 'var(--green)')}
    ${amtCardHtml(sellKrw, sellUsd, sellCount, '매도 금액', 'var(--red)')}
  `;

  document.getElementById('summaryArea').innerHTML = summaryHtml;

  // 평가손익 카드는 summaryArea 아래 별도로
  let pnlHtml = '';
  pnlHtml += pnlCardHtml(pnlNonZ,
    `📊 ${tabWord} 매수 평가손익 (일반)`,
    '일반계좌 매수 종목 현재가 기준', false);
  pnlHtml += pnlCardHtml(pnlZ,
    `🏦 ${tabWord} 매수 평가손익 (Z계좌)`,
    'Z계좌 매수 종목 현재가 기준', true);

  // 기존 pnl 컨테이너 제거 후 재삽입
  let pnlContainer = document.getElementById('pnlContainer');
  if (!pnlContainer) {
    pnlContainer = document.createElement('div');
    pnlContainer.id = 'pnlContainer';
    document.getElementById('summaryArea').after(pnlContainer);
  }
  pnlContainer.innerHTML = pnlHtml;

  // ── 기간 레이블 ──
  document.getElementById('rangeLabel').textContent =
    '📅 ' + (from === to ? fmtDate(from) : `${from} ~ ${to}`);

  // ── 뷰 모드 분기 ──
  document.getElementById('listArea').style.display = viewMode === 'txn' ? '' : 'none';
  document.getElementById('statArea').style.display = viewMode === 'stat' ? '' : 'none';

  if (viewMode === 'stat') {
    renderStat(filteredTx, prices, usdKrw);
    return;
  }

  // ── 거래 없음 ──
  if (!displayTx.length) {
    document.getElementById('listArea').innerHTML =
      `<div class="no-data">📭 해당 기간에 거래 내역이 없습니다.</div>`;
    return;
  }

  // ── 날짜별 그룹화 ──
  const groups = {};
  displayTx.forEach(tx => {
    if (!groups[tx.date]) groups[tx.date] = [];
    groups[tx.date].push(tx);
  });
  const sortedDates = Object.keys(groups).sort((a,b) => b.localeCompare(a));

  _txMap = {};
  let html = '';

  sortedDates.forEach(date => {
    const txList = groups[date];
    const isOpen = _openDates.has(date);

    // 날짜별 매수/매도 합산 (KRW 환산)
    let dBuyKrw=0, dBuyUsd=0, dSellKrw=0, dSellUsd=0;
    txList.forEach(tx => {
      const isUs = tx.market === 'NASDAQ';
      if (tx.type === 'buy')  { if(isUs) dBuyUsd  += tx.totalAmt; else dBuyKrw  += tx.totalAmt; }
      else                    { if(isUs) dSellUsd += tx.totalAmt; else dSellKrw += tx.totalAmt; }
    });
    const dBuy  = dBuyKrw  + dBuyUsd  * usdKrw;
    const dSell = dSellKrw + dSellUsd * usdKrw;

    let amtHtml = '';
    if (dBuy > 0 && dSell > 0) {
      amtHtml = `<span style="color:#00ff88">+₩${fmt(Math.round(dBuy))}</span><span style="color:#5a6b7e"> / </span><span style="color:#ff6666">₩${fmt(Math.round(dSell))}</span>`;
    } else if (dBuy > 0) {
      amtHtml = `<span style="color:#00ff88">+₩${fmt(Math.round(dBuy))}</span>`;
    } else {
      amtHtml = `<span style="color:#ff6666">₩${fmt(Math.round(dSell))}</span>`;
    }

    const cntLabel = mergeMode
      ? `${txList.length}종목 (${txList.reduce((s,t)=>s+t.count,0)}건)`
      : `${txList.length}건`;

    html += `<div class="date-group">
      <div class="date-hdr" onclick="toggleDate('${date}')">
        <div class="date-hdr-left">
          <span class="date-hdr-label">${fmtDate(date)}</span>
          <span class="date-hdr-cnt">${cntLabel}</span>
        </div>
        <div class="date-hdr-right">
          <span class="date-hdr-amt">${amtHtml}</span>
          <span class="date-hdr-arrow ${isOpen?'open':''}" id="arr_${date}">▼</span>
        </div>
      </div>
      <div class="date-body ${isOpen?'':'collapsed'}" id="body_${date}" style="max-height:${isOpen?'4000px':'0'}">
        <div class="date-body-inner">`;

    txList.forEach((tx, idx) => {
      const isBuy      = tx.type === 'buy';
      const tagColor   = isBuy ? '#00ff88' : '#ff4444';
      const tagBg      = isBuy ? '#00ff8820' : '#ff444420';
      const tagBorder  = isBuy ? '#00ff8840' : '#ff444440';
      const tagLabel   = isBuy ? '매수' : '매도';
      const amtDisplay = fmtAmt(tx.totalAmt, tx.market);
      const qtyStr     = fmtQty(tx.totalQty);
      const avgPStr    = fmtAmt(tx.avgPrice, tx.market);

      // 현재 손익 배지
      const curP = prices[tx.stockCode] || 0;
      let pnlBadge = '';
      if (curP > 0 && tx.avgPrice > 0 && isBuy) {
        const pct = (curP - tx.avgPrice) / tx.avgPrice * 100;
        const c   = pct >= 0 ? '#00ff88' : '#ff4444';
        pnlBadge  = `<span style="font-size:11px;color:${c};font-weight:700;margin-left:5px">${pct>=0?'+':''}${pct.toFixed(1)}%</span>`;
      }

      const mergeBadge = (mergeMode && tx.count > 1)
        ? `<span style="font-size:10px;color:#5a6b7e;font-weight:400;margin-left:4px">×${tx.count} avg ${avgPStr}</span>`
        : '';

      const isZBroker = tx.broker === 'Z';
      const txKey = `${date}_${idx}`;
      _txMap[txKey] = tx;

      html += `<div class="tx-row" onclick="openDetail('${txKey}')">
        <div class="tx-left">
          <span class="tx-tag" style="background:${tagBg};border:1px solid ${tagBorder};color:${tagColor}">${tagLabel}</span>
          <div class="tx-info">
            <div class="tx-name-row">
              <span class="tx-name">${tx.stockName}</span>
              ${pnlBadge}
            </div>
            <div class="tx-broker ${isZBroker?'z':''}">${tx.broker||''}${tx.broker?' · ':''}${tx.stockCode}${mergeBadge}</div>
          </div>
        </div>
        <div class="tx-right">
          <div class="tx-amt" style="color:${tagColor}">${amtDisplay}</div>
          <div class="tx-qty">${qtyStr}</div>
        </div>
      </div>`;
    });

    html += `</div></div></div>`;
  });

  document.getElementById('listArea').innerHTML = html;
}

// ── 종목 통계 ──
function renderStat(filteredTxIn, pricesIn, usdKrwIn) {
  const stocks   = JSON.parse(localStorage.getItem('pf_stocks_v2')   || '[]');
  const archived = JSON.parse(localStorage.getItem('pf_archived_v2') || '[]');
  const prices   = pricesIn   || JSON.parse(localStorage.getItem('pf_prices_v2') || '{}');
  const usdKrw   = usdKrwIn  || parseFloat(localStorage.getItem('pf_usdkrw') || '1500');

  let filteredTx = filteredTxIn;
  if (!filteredTx) {
    const { from, to } = getRange();
    const allTx = [];
    stocks.concat(archived).forEach(s => {
      (s.transactions || []).forEach(tx => {
        if (tx.date >= from && tx.date <= to) {
          allTx.push({ ...tx, stockName: s.name, stockCode: s.code,
            market: s.market||'KS', broker: s.broker||'', stockObj: s });
        }
      });
    });
    filteredTx = brokerFilter === 'all' ? allTx : allTx.filter(t => t.broker === brokerFilter);
  }

  const statMap = {};
  filteredTx.forEach(tx => {
    const key = `${tx.stockCode}__${tx.broker}`;
    if (!statMap[key]) statMap[key] = {
      name: tx.stockName, code: tx.stockCode, broker: tx.broker,
      market: tx.market, buyCount:0, sellCount:0,
      buyAmt:0, sellAmt:0, buyQty:0, sellQty:0,
    };
    const s = statMap[key];
    const amt = tx.price * Number(tx.qty);
    if (tx.type === 'buy')  { s.buyCount++;  s.buyAmt  += amt; s.buyQty  += Number(tx.qty); }
    else                    { s.sellCount++; s.sellAmt += amt; s.sellQty += Number(tx.qty); }
  });

  const items = Object.values(statMap).sort((a,b) => (b.buyAmt+b.sellAmt)-(a.buyAmt+a.sellAmt));

  if (!items.length) {
    document.getElementById('statArea').innerHTML = `<div class="no-data">해당 기간 거래 내역이 없습니다</div>`;
    return;
  }

  let html = '';
  items.forEach(s => {
    const isUs = s.market === 'NASDAQ';
    const buyAmtStr  = fmtAmt(s.buyAmt,  s.market);
    const sellAmtStr = fmtAmt(s.sellAmt, s.market);
    const allStocks  = stocks.concat(archived);
    const curStock   = allStocks.find(st => st.code === s.code && st.broker === s.broker);
    const curPrice   = prices[s.code] || 0;
    let pnlHtml = '';
    if (curStock && curPrice > 0) {
      const { avg: curAvg, qty: curQty } = calcAvg(curStock.transactions || []);
      if (curQty > 0 && curAvg > 0) {
        const pct = (curPrice - curAvg) / curAvg * 100;
        const c   = pct >= 0 ? '#00ff88' : '#ff4444';
        pnlHtml = `<span style="color:${c};font-size:12px;font-weight:700">${pct>=0?'+':''}${pct.toFixed(1)}%</span>`;
      }
    }
    const isZB = s.broker === 'Z';
    html += `<div style="background:#080c14;border:1px solid #1a2535;border-radius:10px;padding:12px 14px;margin-bottom:8px">
      <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:10px">
        <div style="min-width:0">
          <div style="font-size:14px;font-weight:700;color:#f1f5f9;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:180px">${s.name}</div>
          <div style="font-size:11px;color:#5a6b7e;margin-top:2px">${s.code} · <span style="color:${isZB?'var(--gold)':'var(--purple)'}">${s.broker}</span></div>
        </div>
        <div style="text-align:right;flex-shrink:0">${pnlHtml}
          <div style="font-size:11px;color:#5a6b7e;margin-top:2px">총 ${s.buyCount+s.sellCount}건</div>
        </div>
      </div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px">
        <div style="background:#0d1420;border-radius:7px;padding:9px 11px">
          <div style="font-size:10px;color:#5a6b7e;margin-bottom:3px">매수</div>
          <div style="font-size:13px;font-weight:700;color:#00ff88">${buyAmtStr}</div>
          <div style="font-size:11px;color:#5a6b7e;margin-top:1px">${s.buyCount}건 · ${s.buyQty%1===0?s.buyQty.toLocaleString():s.buyQty.toFixed(2)}주</div>
        </div>
        <div style="background:#0d1420;border-radius:7px;padding:9px 11px">
          <div style="font-size:10px;color:#5a6b7e;margin-bottom:3px">매도</div>
          <div style="font-size:13px;font-weight:700;color:${s.sellAmt>0?'#ff6666':'#334155'}">${s.sellAmt>0?sellAmtStr:'—'}</div>
          <div style="font-size:11px;color:#5a6b7e;margin-top:1px">${s.sellCount>0?s.sellCount+'건':'—'}</div>
        </div>
      </div>
    </div>`;
  });
  document.getElementById('statArea').innerHTML = html;
}

// ── 날짜 그룹 토글 ──
function toggleDate(date) {
  const body  = document.getElementById('body_' + date);
  const arrow = document.getElementById('arr_'  + date);
  if (!body) return;
  const isOpen = _openDates.has(date);
  if (isOpen) {
    _openDates.delete(date);
    body.style.maxHeight = '0';
    body.classList.add('collapsed');
    if (arrow) arrow.classList.remove('open');
  } else {
    _openDates.add(date);
    body.style.maxHeight = '4000px';
    body.classList.remove('collapsed');
    if (arrow) arrow.classList.add('open');
  }
}

// ── 상세 모달 ──
function openDetail(txKey) {
  const tx = _txMap[txKey];
  if (!tx) return;

  const isBuy     = tx.type === 'buy';
  const tagColor  = isBuy ? '#00ff88' : '#ff4444';
  const tagLabel  = isBuy ? '매수' : '매도';
  const s         = tx.stockObj;
  const stocks    = JSON.parse(localStorage.getItem('pf_stocks_v2')   || '[]');
  const archived  = JSON.parse(localStorage.getItem('pf_archived_v2') || '[]');
  const prices    = JSON.parse(localStorage.getItem('pf_prices_v2')   || '{}');
  const usdKrw    = parseFloat(localStorage.getItem('pf_usdkrw') || '1500');

  // stockObj가 없을 수 있으니 보완
  const allStocks = stocks.concat(archived);
  const fullStock = s || allStocks.find(st => st.code === tx.stockCode && st.broker === tx.broker);

  const fmtP = (v, mkt) => mkt === 'NASDAQ'
    ? '$' + v.toLocaleString('en-US', {minimumFractionDigits:2, maximumFractionDigits:2})
    : '₩' + fmt(v);

  const amtStr    = fmtAmt(tx.totalAmt, tx.market);
  const qtyStr    = fmtQty(tx.totalQty);
  const avgPStr   = fmtAmt(tx.avgPrice, tx.market);

  // 보유 평균단가
  const lastDate  = tx._rawList[tx._rawList.length-1].date;
  const avgAtTx   = fullStock ? calcAvgAtDate(fullStock.transactions || [], lastDate) : 0;
  const avgStr    = avgAtTx > 0 ? fmtP(avgAtTx, tx.market) : '—';

  // 현재 보유
  const { avg: curAvg, qty: curQty } = fullStock ? calcAvg(fullStock.transactions || []) : { avg:0, qty:0 };
  const curPrice   = prices[tx.stockCode] || 0;
  const curPriceStr = curPrice > 0 ? fmtP(curPrice, tx.market) : '—';
  const curQtyStr   = curQty > 0
    ? (curQty%1===0 ? curQty.toLocaleString() : curQty.toFixed(4)) + '주 보유'
    : '보유 없음';

  // 거래가 대비 현재가
  let tradePnlHtml = '<span style="color:#5a6b7e">—</span>';
  if (curPrice > 0 && tx.avgPrice > 0 && isBuy) {
    const pct  = (curPrice - tx.avgPrice) / tx.avgPrice * 100;
    const c    = pct >= 0 ? '#00ff88' : '#ff4444';
    const sign = pct >= 0 ? '+' : '';
    tradePnlHtml = `<span style="color:${c};font-size:22px;font-weight:800">${sign}${pct.toFixed(2)}%</span>
      <div style="font-size:11px;color:#5a6b7e;margin-top:3px">거래가 ${avgPStr} → 현재 ${curPriceStr}</div>`;
  } else if (!isBuy) {
    tradePnlHtml = `<span style="color:#5a6b7e;font-size:13px">매도 거래</span>`;
  }

  // 보유 포지션 손익
  let holdPnlHtml = '';
  if (curPrice > 0 && curQty > 0 && curAvg > 0) {
    const pnl  = (curPrice - curAvg) * curQty;
    const pct  = (curPrice - curAvg) / curAvg * 100;
    const c    = pnl >= 0 ? '#00ff88' : '#ff4444';
    const sign = pnl >= 0 ? '+' : '';
    const pnlAmtStr = tx.market === 'NASDAQ'
      ? '$' + Math.abs(pnl).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2})
        + (usdKrw>0 ? ` <span style="font-size:11px;color:#7a95ae">≈₩${fmt(Math.abs(pnl*usdKrw))}</span>` : '')
      : '₩' + fmt(Math.abs(pnl));
    holdPnlHtml = `
      <div class="jdetail-divider"></div>
      <div style="font-size:11px;color:#5a6b7e;letter-spacing:1px;margin-bottom:8px">보유 포지션 손익 (평균단가 기준)</div>
      <div style="display:flex;justify-content:space-between;align-items:center">
        <div>
          <div style="font-size:13px;color:#94a3b8">평균단가 ${fmtP(curAvg, tx.market)}</div>
          <div style="font-size:11px;color:#5a6b7e;margin-top:2px">${curQtyStr}</div>
        </div>
        <div style="text-align:right">
          <div style="font-size:18px;font-weight:800;color:${c}">${sign}${pct.toFixed(2)}%</div>
          <div style="font-size:12px;color:${c};margin-top:1px">${sign}${pnlAmtStr}</div>
        </div>
      </div>`;
  } else if (fullStock && curQty === 0 && fullStock.realizedPnl != null) {
    const rPnl = fullStock.realizedPnl || 0;
    const c    = rPnl >= 0 ? '#00ff88' : '#ff4444';
    holdPnlHtml = `
      <div class="jdetail-divider"></div>
      <div style="font-size:11px;color:#5a6b7e;margin-bottom:6px">실현손익 (처분완료)</div>
      <div style="font-size:16px;font-weight:800;color:${c}">${rPnl>=0?'+':''}₩${fmt(rPnl)}</div>`;
  }

  // 합산 내역
  let mergeTableHtml = '';
  if (tx._merged && tx.count > 1) {
    const rows = tx._rawList.map(r => {
      const rQty = Number(r.qty);
      return `<div style="display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid #1a2535;font-size:12px">
        <span style="color:#94a3b8">${fmtQty(rQty)}</span>
        <span style="color:#e8edf5;font-weight:700">${fmtP(r.price, tx.market)}</span>
      </div>`;
    }).join('');
    mergeTableHtml = `
      <div class="jdetail-divider"></div>
      <div style="font-size:11px;color:#5a6b7e;letter-spacing:1px;margin-bottom:6px">개별 체결 내역 (${tx.count}건)</div>
      ${rows}
      <div style="display:flex;justify-content:space-between;padding:7px 0;font-size:12px;margin-top:2px">
        <span style="color:#5a6b7e">합계</span>
        <span style="color:${tagColor};font-weight:700">${qtyStr} · ${amtStr}</span>
      </div>`;
  }

  document.getElementById('dmTitle').textContent =
    `${fmtDate(tx.date)} · ${tagLabel}`;
  document.getElementById('dmName').innerHTML =
    `<span style="background:${isBuy?'#00ff8820':'#ff444420'};border:1px solid ${isBuy?'#00ff8840':'#ff444440'};color:${tagColor};border-radius:5px;padding:2px 9px;font-size:12px;margin-right:8px">${tagLabel}</span>${tx.stockName}<span class="broker-tag">${tx.broker||''}</span>${tx._merged&&tx.count>1?`<span style="font-size:11px;color:#5a6b7e;margin-left:6px">${tx.count}건 합산</span>`:''}`;

  document.getElementById('dmGrid').innerHTML = `
    <div class="jdetail-item">
      <div class="jdetail-label">${tx._merged&&tx.count>1?'합산 금액':'거래 금액'}</div>
      <div class="jdetail-value" style="color:${tagColor}">${amtStr}</div>
      <div class="jdetail-sub">${qtyStr}</div>
    </div>
    <div class="jdetail-item">
      <div class="jdetail-label">${tx._merged&&tx.count>1?'평균 체결가':'거래 단가'}</div>
      <div class="jdetail-value">${avgPStr}</div>
      <div class="jdetail-sub">${tx.market} · ${tx.stockCode}</div>
    </div>
    <div class="jdetail-item">
      <div class="jdetail-label">보유 평균단가</div>
      <div class="jdetail-value" style="color:#94a3b8">${avgStr}</div>
      <div class="jdetail-sub">${lastDate} 기준</div>
    </div>
    <div class="jdetail-item">
      <div class="jdetail-label">현재가</div>
      <div class="jdetail-value" style="color:#00ccff">${curPriceStr}</div>
      <div class="jdetail-sub">${curQtyStr}</div>
    </div>`;

  document.getElementById('dmPnl').innerHTML = `
    <div style="font-size:11px;color:#5a6b7e;letter-spacing:1px;margin-bottom:8px">거래가 대비 현재 수익률</div>
    <div style="text-align:center;padding:8px 0">${tradePnlHtml}</div>
    ${holdPnlHtml}
    ${mergeTableHtml}`;

  document.getElementById('detailModal').classList.add('open');
}

function closeDetail() {
  document.getElementById('detailModal').classList.remove('open');
}

// 모달 배경 클릭 닫기
document.getElementById('detailModal').addEventListener('click', function(e) {
  if (e.target === this) closeDetail();
});

// ── 초기화 ──
(function() {
  const today = new Date().toISOString().slice(0,10);
  const fe = document.getElementById('dateFrom'), te = document.getElementById('dateTo');
  if (fe) fe.value = today;
  if (te) te.value = today;
  render();
})();
</script>
</body>
</html>
